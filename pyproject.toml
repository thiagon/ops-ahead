[project]
name = "ops-ahead"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["scripts", "apps/*"]
# apps/gateway is a Node/TypeScript service (npm), not a uv member.
exclude = ["apps/gateway"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
