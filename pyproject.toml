[project]
name = "ops-ahead"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["scripts", "notebooks", "apps/*"]
# apps/ui-gateway, apps/ui-orchestrator and apps/ui-frontend are
# Node/TypeScript services (npm), not uv members.
exclude = ["apps/ui-gateway", "apps/ui-orchestrator", "apps/ui-frontend"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
