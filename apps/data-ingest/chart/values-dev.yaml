# Pulled from the in-cluster Gitea registry (built + pushed by Gitea Actions).
image:
  pullPolicy: IfNotPresent

# migrate/migrate is a public image — it must be pulled, not Never.
migration:
  pullPolicy: IfNotPresent

consumer:
  replicaCount: 1
  env:
    batchMaxSize: "100"
    batchMaxSeconds: "5"
