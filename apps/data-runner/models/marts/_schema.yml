version: 2

models:
  - name: incidents_by_ic
    columns:
      - name: entity_id
        tests: [not_null]
      - name: window_hours
        tests:
          - not_null
          - accepted_values:
              values: [1, 6, 24]
      - name: window_start
        tests: [not_null]
      - name: incident_count
        tests: [not_null]
      - name: no_intervention_count
        tests: [not_null]

  - name: group_load_by_window
    columns:
      - name: owner
        tests: [not_null]
      - name: snapshot_at
        tests: [not_null]
      - name: incidents_open
        tests: [not_null]

  - name: p4_sequences_by_ci
    columns:
      - name: entity_id
        tests: [not_null]
      - name: sequence_length
        tests: [not_null]

  - name: first_touch_duration
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: external_id
        tests: [not_null]
      - name: opened_at
        tests: [not_null]
      - name: severity
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: deadline_seconds
        tests: [not_null]

  - name: priority_changes_log
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: external_id
        tests: [not_null]
      - name: severity_from
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: severity_to
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: kpi_monthly_state
    columns:
      - name: month
        tests: [not_null]
      - name: severity
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]
      - name: breach_rate
        # Nullable by design: NULL when the bucket has zero KPI-counted
        # incidents (undefined rate), not the same thing as a 0.0 breach rate.
      - name: open_at_risk_count
        tests: [not_null]
