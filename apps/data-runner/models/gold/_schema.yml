version: 2

models:
  - name: gold_monitor_signal_counts
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: entity_id
        tests: [not_null]
      - name: window_minutes
        tests:
          - not_null
          - accepted_values:
              values: [15, 60, 360]
      - name: window_start
        tests: [not_null]
      - name: signal_count
        tests: [not_null]

  - name: gold_monitor_auto_resolution_rate
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: entity_id
        tests: [not_null]
      - name: auto_resolution_rate
        tests: [not_null]

  - name: gold_monitor_signal_intervals
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: entity_id
        tests: [not_null]
      - name: median_interval_seconds
        tests: [not_null]

  - name: gold_monitor_severity_escalations
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: entity_id
        tests: [not_null]
      - name: date
        tests: [not_null]
      - name: escalation_count
        tests: [not_null]

  - name: gold_monitor_daily_features
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: date
        tests: [not_null]
      - name: source
        tests: [not_null]
      - name: p1_share
        tests: [not_null]
      - name: critical_share
        tests: [not_null]

  - name: gold_alert_breach_consolidation
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: external_id
        tests: [not_null]
      - name: closed_at
        tests: [not_null]
      - name: duration_seconds
        tests: [not_null]
      - name: overage_seconds
        tests: [not_null]

  - name: gold_alert_daily_features
    columns:
      - name: date
        tests: [not_null]
      - name: source
        tests: [not_null]
      - name: total_incidents
        tests: [not_null]
      - name: p1_share
        tests: [not_null]
      - name: no_intervention_share
        tests: [not_null]

  - name: gold_alert_kpi_achievement
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: month
        tests: [not_null]
      - name: severities
        tests: [not_null]
      - name: breached_ytd
        tests: [not_null]
      - name: achievement_pct
        tests: [not_null]

  - name: gold_alert_category_trends
    columns:
      - name: date
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: product
        tests: [not_null]
      - name: total_incidents
        tests: [not_null]

  - name: gold_alert_category_entity_breakdown
    columns:
      - name: date
        tests: [not_null]
      - name: entity_id
        tests: [not_null]
      - name: severity
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: incident_count
        tests: [not_null]
