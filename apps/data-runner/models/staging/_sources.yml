version: 2

sources:
  - name: ingest
    database: "{{ env_var('CLICKHOUSE_DATABASE', 'default') }}"
    schema: "{{ env_var('CLICKHOUSE_DATABASE', 'default') }}"
    tables:
      - name: bronze_alert
        columns:
          - name: event_id
            tests: [not_null, unique]
          - name: severity
            tests:
              - not_null
              - accepted_values:
                  values: [1, 2, 3, 4, 5]
          - name: opened_at
            tests: [not_null]
          - name: tenant_id
            tests: [not_null]
          - name: external_id
            tests: [not_null]
      - name: bronze_monitor
        columns:
          - name: event_id
            tests: [not_null, unique]
          - name: started_at
            tests: [not_null]
          - name: entity_id
            tests: [not_null]
          - name: tenant_id
            tests: [not_null]
      - name: bronze_deadline_milestone
        columns:
          - name: event_id
            tests: [not_null, unique]
          - name: occurred_at
            tests: [not_null]
          - name: kind
            tests:
              - not_null
              - accepted_values:
                  values: [pct_25, pct_50, pct_75, pct_100, abandoned]
          - name: tenant_id
            tests: [not_null]
          - name: external_id
            tests: [not_null]
