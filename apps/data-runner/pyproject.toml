[project]
name = "ops-ahead-data-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dbt-clickhouse>=1.8.1",
    "great-expectations>=1.2",
    "clickhouse-sqlalchemy>=0.3",
    "sqlalchemy>=2.0",
    "boto3>=1.35",
    "pydantic-settings>=2.5",
    "kafka-python>=3.0",
    "mlflow>=2.17",
    "clickhouse-driver>=0.2.9",
]

[dependency-groups]
dev = [
    "pandas>=2.2",
    "pytest>=8.0",
]
