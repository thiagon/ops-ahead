[project]
name = "ops-ahead-data-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dbt-clickhouse>=1.8.1",
    "great-expectations>=1.2",
    "clickhouse-sqlalchemy>=0.3",
    "sqlalchemy>=2.0",
    "boto3>=1.35",
    "pydantic-settings>=2.5",
    "kafka-python>=3.0",
    "mlflow>=2.17",
    "clickhouse-driver>=0.2.9",
    "prometheus-client>=0.21",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pandas>=2.2",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# The container entrypoint runs with src/ on PYTHONPATH (see Dockerfile), so
# tests import the same way (`from settings import ...`, not `from
# src.settings import ...`) — this has to point at the same root.
pythonpath = ["src"]
