# Every app follows the same rule — <app>.image.tag — pinned by the Gitea
# Actions write-back. The registry repository and pullPolicy live in the chart
# defaults; the overlay only carries the per-env tag.
ui-gateway:
  image:
    tag: "latest"
gateway:
  replicaCount: 1
  env:
    appEnv: dev
    logLevel: debug
