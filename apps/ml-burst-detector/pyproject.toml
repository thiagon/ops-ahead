[project]
name = "ops-ahead-ml-burst-detector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faststream[kafka]>=0.5",
    "redis>=5.0",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pandas>=2.2,<3",
]

[tool.pytest.ini_options]
# The container entrypoint runs with src/ on PYTHONPATH (see Dockerfile), so
# tests import the same way (`from detector import ...`, not `from
# src.detector import ...`) — this has to point at the same root.
pythonpath = ["src"]
