# Deploy identity for this app (documentation — see apps/data-ingest/chart/app.yaml).
# `scaledjob`: a KEDA ScaledJob is this app's own workload — own ArgoCD App,
# same as `deployment`/`cronjob`/`job`, but the resource that actually
# creates the Job is KEDA (platform infra), never an app process (see
# conductor/tracks/exec-trigger_20260807/spec.md, Princípio central #2).
# Replaces the old `pipeline-step` shape (bespoke WorkflowTemplate,
# infra/charts/ml-workflow-template) now that the Argo Workflows engine is
# gone from the stack.
workload: scaledjob
namespace: ml
chart: infra/charts/ml-trainer
