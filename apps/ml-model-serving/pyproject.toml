[project]
name = "ops-ahead-ml-model-serving"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bentoml>=1.3",
    "mlflow>=2.17",
    "pandas>=2.2,<3",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Not called directly here — needed to unpickle the bundled MLflow
    # PythonModel objects ml-trainer registers (LightGBM/Prophet/isotonic/
    # SHAP artifacts). code_paths ships the model *code*, not its
    # third-party imports.
    "lightgbm>=4.5",
    "prophet>=1.1.6",
    "holidays>=0.60",
    "shap>=0.46",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
# The container entrypoint runs with src/ on PYTHONPATH (see Dockerfile) — a
# top-level `src` package here would also shadow the unprefixed module names
# (e.g. `settings`) that unpickled MLflow model classes from ml-trainer
# resolve against, so tests import the same way (`from settings import ...`,
# not `from src.settings import ...`) and this has to point at the same root.
pythonpath = ["src"]
