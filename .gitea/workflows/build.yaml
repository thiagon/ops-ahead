name: build-apps

# App/source changes trigger a build. The write-back commit only touches the
# colocated chart overlays (apps/*/chart) and infra/**, all ignored here — so it
# never re-triggers this workflow (plus [skip ci] on the commit as a belt).
#
# `create` seeds a fresh registry on bootstrap: `make destroy` wipes the Gitea
# PVC, so repo + registry vanish together. The next `make up` snapshot-pushes an
# empty repo, which *creates* main → this fires once and rebuilds all images.
# A clean working dir produces no push diff, so push alone would never trigger.
# `workflow_dispatch` stays for manual reseeds.
on:
  create:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/*/chart/**'
      - 'infra/**'
      - 'docs/**'
      - 'conductor/**'
      - '**.md'
  workflow_dispatch: {}

env:
  REGISTRY: gitea.ops-ahead.localtest.me
  OWNER: ops-ahead

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout
      packages: write     # push images to the Gitea registry
    strategy:
      matrix:
        app: [data-ingest, data-transform, data-quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build & push ${{ matrix.app }}:${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${{ matrix.app }}"
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${REGISTRY}" -u "${OWNER}" --password-stdin
          docker build -f "apps/${{ matrix.app }}/Dockerfile" -t "${IMAGE}:${{ github.sha }}" .
          docker push "${IMAGE}:${{ github.sha }}"

  write-back:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # commit the pinned image tags back to main
    steps:
      - uses: actions/checkout@v4
      - name: Pin image tags to ${{ github.sha }}
        run: |
          SHA="${{ github.sha }}"
          REG="${REGISTRY}/${OWNER}"
          # Every app pins its image inline in its per-env overlay — yq edits just
          # the relevant key, leaving the rest of that env's config untouched.
          # Workers key on .image.tag; pipeline steps key on an app-scoped .image
          # so the pipeline App can layer several steps via $values.
          SHA="$SHA" yq -i '.image.tag = strenv(SHA)' \
            apps/data-ingest/chart/values-dev.yaml
          REG="$REG" SHA="$SHA" yq -i '.transform.image = strenv(REG) + "/data-transform:" + strenv(SHA)' \
            apps/data-transform/chart/values-dev.yaml
          REG="$REG" SHA="$SHA" yq -i '.quality.image = strenv(REG) + "/data-quality:" + strenv(SHA)' \
            apps/data-quality/chart/values-dev.yaml
      - name: Commit & push write-back
        run: |
          git config user.name "gitea-actions"
          git config user.email "actions@ops-ahead.local"
          git add apps/data-ingest/chart/values-dev.yaml \
                  apps/data-transform/chart/values-dev.yaml \
                  apps/data-quality/chart/values-dev.yaml
          git commit -m "ci: pin image tags to ${{ github.sha }} [skip ci]" || exit 0
          git push origin HEAD:main
