name: build-apps

on:
  create:
  push:
    branches: [main]
    # An inclusion list, not paths-ignore: the force marker has to be able to
    # trigger the workflow on its own. paths-ignore is evaluated before any job
    # starts, so a snapshot touching only ignored paths never reaches
    # detect-changes and FORCE=1 has nothing to act on.
    paths:
      - "apps/**"
      - "!apps/*/chart/**"
      - "contracts/**"
      - "scripts/**"
      - ".gitea/workflows/**"
      - ".ci/**"
  workflow_dispatch: {}

env:
  REGISTRY: gitea.ops-ahead.localtest.me
  OWNER: ops-ahead

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow depth: dev-sync.sh always force-pushes
          # a single squashed snapshot commit, so `HEAD^` is that commit's
          # local parent, not what Gitea's main actually had before this
          # push — diffing against it makes every already-committed app look
          # unchanged. `github.event.before` (the ref's pre-push SHA) is what
          # actually changed since the last push; it only resolves reliably
          # with full history available to look it up.
          fetch-depth: 0

      - name: Detect changed apps
        id: set-matrix
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ -f .ci/force-build ]; then
            CHANGED=$(ls -1 apps/)
          elif [ "${{ github.event_name }}" == "push" ] \
             && [ -n "$BEFORE_SHA" ] \
             && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" | grep '^apps/' | cut -d/ -f2 | sort -u)
          else
            CHANGED=$(ls -1 apps/)
          fi

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "Nenhum app modificado."
            exit 0
          fi

          JSON_ARRAY=$(echo "$CHANGED" | jq -R . | jq -s -c .)

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "matrix=${JSON_ARRAY}" >> $GITHUB_OUTPUT
          echo "Apps alterados: ${JSON_ARRAY}"

  registry-ready:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Wait until the registry accepts a push
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${REGISTRY}" -u "${OWNER}" --password-stdin
          mkdir -p /tmp/probe && echo ok > /tmp/probe/ok
          printf 'FROM scratch\nCOPY ok /ok\n' > /tmp/probe/Dockerfile
          PROBE="${REGISTRY}/${OWNER}/ci-registry-probe:latest"
          docker build -t "${PROBE}" /tmp/probe
          deadline=$(( SECONDS + 480 ))
          until docker push "${PROBE}"; do
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "registry never accepted a push after 8min" >&2
              exit 1
            fi
            echo "registry not accepting pushes yet (Gitea/ingress settling) — retrying in 15s" >&2
            sleep 15
          done

  # One job per app, in parallel. The matrix is STATIC (a literal list) — that
  # expands fine on Gitea act_runner. Only a *dynamic* matrix from a needs-output
  # fails to expand (the strategy is resolved before needs outputs exist), which
  # is why detect-changes feeds the job `if:` instead of the matrix: a job whose
  # app didn't change is skipped, so only changed apps actually build.
  build:
    needs: [detect-changes, registry-ready]
    if: needs.detect-changes.outputs.has_changes == 'true' && contains(fromJson(needs.detect-changes.outputs.matrix), matrix.app)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # A failed app must not hold back the ones that did publish: `needs: [build]`
    # is only satisfied when every matrix leg succeeds, so without this a single
    # push failure leaves every other app pinned to its previous tag. write-back
    # pins from the registry instead, so a leg that failed here simply has no
    # manifest to find.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [data-ingest, data-runner, data-deadline-tracker, ui-gateway, ui-frontend, ml-trainer, ml-burst-detector, ml-model-serving]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.app }}:${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${{ matrix.app }}"
          docker build -f "apps/${{ matrix.app }}/Dockerfile" -t "${IMAGE}:${{ github.sha }}" .

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${REGISTRY}" -u "${OWNER}" --password-stdin

      - name: Push ${{ matrix.app }}:${{ github.sha }}
        # Push is the only step that talks to the registry service, so isolate it
        # and retry just here — a transient registry hiccup never re-runs the build.
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${{ matrix.app }}"
          for attempt in 1 2 3; do
            docker push "${IMAGE}:${{ github.sha }}" && exit 0
            echo "push attempt ${attempt} failed; retrying in $((attempt * 5))s" >&2
            sleep $((attempt * 5))
          done
          echo "push failed after 3 attempts" >&2
          exit 1

  write-back:
    needs: [detect-changes, build]
    if: always() && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pin image tags
        env:
          CHANGED_APPS_JSON: ${{ needs.detect-changes.outputs.matrix }}
        run: |
          SHA="${{ github.sha }}"
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${REGISTRY}" -u "${OWNER}" --password-stdin

          # Same rule for every app: pin <app>.image.tag. Keying by the app's own
          # name keeps distinct top-level keys, so a pipeline App that layers
          # several step overlays into one release never collides on `image`.
          #
          # The registry, not the build job, decides what gets pinned: a tag is
          # only written once its manifest is actually pullable, so an app whose
          # push failed keeps its previous tag and ArgoCD is never pointed at an
          # image that does not exist.
          PINNED=""; SKIPPED=""
          for app in $(echo "$CHANGED_APPS_JSON" | jq -r '.[]'); do
            FILE="apps/${app}/chart/values-dev.yaml"
            [ -f "$FILE" ] || continue
            if docker manifest inspect "${REGISTRY}/${OWNER}/${app}:${SHA}" > /dev/null 2>&1; then
              APP="$app" SHA="$SHA" yq -i '.[env(APP)].image.tag = env(SHA)' "$FILE"
              git add "$FILE"
              PINNED="${PINNED} ${app}"
            else
              SKIPPED="${SKIPPED} ${app}"
            fi
          done

          echo "pinned:${PINNED:- none}"
          echo "skipped (no image in registry):${SKIPPED:- none}"

          # Keep the marker when an app still needs building, so the next run
          # retries it instead of diffing it away as unchanged.
          if [ -f .ci/force-build ] && [ -z "$SKIPPED" ]; then
            git rm .ci/force-build
          fi

          if [ -n "$SKIPPED" ]; then
            echo "::warning::these apps were not deployed:${SKIPPED}"
          fi

      - name: Commit & push write-back
        run: |
          git config user.name "gitea-actions"
          git config user.email "actions@ops-ahead.local"
          git diff --staged --quiet || git commit -m "ci: pin image tags to ${{ github.sha }} [skip ci]"
          git push origin HEAD:main

      # continue-on-error above lets the publishable apps through, which also
      # means the run would otherwise report success while an app is missing.
      # Fail here, after the write-back, so the deploys still happen and the
      # run is still red.
      - name: Fail if any app is missing from the registry
        env:
          CHANGED_APPS_JSON: ${{ needs.detect-changes.outputs.matrix }}
        run: |
          MISSING=""
          for app in $(echo "$CHANGED_APPS_JSON" | jq -r '.[]'); do
            docker manifest inspect "${REGISTRY}/${OWNER}/${app}:${{ github.sha }}" > /dev/null 2>&1 \
              || MISSING="${MISSING} ${app}"
          done
          [ -z "$MISSING" ] && exit 0
          echo "apps that failed to publish:${MISSING}" >&2
          exit 1
