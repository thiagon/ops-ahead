# App-of-Apps entry point.
# Apply once: kubectl apply -f infra/bootstrap/root-app.yaml
# After that, ArgoCD manages everything via infra/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ops-ahead-root
  namespace: infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/thiagon/ops-ahead
    targetRevision: main
    path: infra/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true     # forces selfHeal to respect ignoreDifferences
  # dev-up.sh rewrites child Apps' repoURL to the local Gitea.
  # Without this ignore + RespectIgnoreDifferences, selfHeal would revert it to GitHub.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/repoURL
