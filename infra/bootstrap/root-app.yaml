# App-of-Apps entry point.
# Apply once: kubectl apply -f infra/bootstrap/root-app.yaml
# After that, ArgoCD manages everything via infra/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ops-ahead-root
  namespace: infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  revisionHistoryLimit: 3
  source:
    repoURL: https://github.com/thiagon/ops-ahead
    targetRevision: main
    path: infra/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true     # forces selfHeal to respect ignoreDifferences
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  # dev-up.sh rewrites child Apps' (and the ApplicationSet's) repoURL to the local
  # Gitea. Without this ignore + RespectIgnoreDifferences, selfHeal would revert it
  # to GitHub — and for the ApplicationSet that would cascade to the Apps it generates.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - .spec.source.repoURL          # single-source apps
        - .spec.sources[].repoURL       # multi-source apps (e.g. data-ingest)
        # reconcile_child_apps injects values-local.yaml on k3d; keep that live.
        - .spec.source.helm.valueFiles
        - .spec.sources[].helm.valueFiles
    - group: argoproj.io
      kind: ApplicationSet
      jsonPointers:
        - /spec/templatePatch           # raw block restates sources[].repoURL
      jqPathExpressions:
        - .spec.generators[].git.repoURL
        - .spec.template.spec.sources[].repoURL
