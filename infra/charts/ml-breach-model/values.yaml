# Keyed by the app's own name so the write-back rule (<app>.image.tag) is the
# same for every app.
ml-breach-model:
  image:
    repository: gitea.ops-ahead.localtest.me/ops-ahead/ml-breach-model
    tag: latest
    pullPolicy: IfNotPresent

job:
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  env:
    clickhouseHost: clickhouse.data.svc.cluster.local
    clickhouseUser: ops_ahead
    clickhouseDatabase: default
    mlflowTrackingUri: http://mlflow-tracking.ml.svc.cluster.local:5000
    mlflowExperimentName: breach-risk
    mlflowRegisteredModelName: breach-risk
    # trainEnd/validationEnd/holdoutEnd deliberately not set here — they come
    # from the shared infra/apps/ml-temporal-split-values.yaml, layered in by
    # the ArgoCD Application, so this and ml-volume-model can never drift
    # apart on the split boundaries.
    p4PrecursorWindowHours: "24"
    optunaTrials: "50"
    autoPromote: "true"
  secretName: ml-breach-model-secret
