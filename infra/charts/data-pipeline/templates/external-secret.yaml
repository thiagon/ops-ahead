apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Created before any Workflow can run against it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: clickhouse-password
      remoteRef: { key: clickhouse, property: CLICKHOUSE_PASSWORD }
    - secretKey: minio-access-key
      remoteRef: { key: minio, property: MINIO_ROOT_USER }
    - secretKey: minio-secret-key
      remoteRef: { key: minio, property: MINIO_ROOT_PASSWORD }
