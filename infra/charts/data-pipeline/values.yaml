# Defaults for the pipeline shape. A pipeline in pipelines/<name>/ overrides only
# what is specific to it (source, marts, cron) via $values; the step images come
# from each app's per-env overlay (values-dev.yaml), keyed by the app's own name
# so several steps layer into one release without colliding.
source: ""

data-transform:
  image:
    repository: gitea.ops-ahead.localtest.me/ops-ahead/data-transform
    tag: ""
data-quality:
  image:
    repository: gitea.ops-ahead.localtest.me/ops-ahead/data-quality
    tag: ""

# Marts counted by register-snapshot and logged to MLflow.
snapshot:
  marts: []

clickhouseHost: clickhouse.data.svc.cluster.local
clickhouseDatabase: default
clickhouseUser: ops_ahead
minioEndpoint: http://minio.data.svc.cluster.local:9000
minioBucket: ops-ahead-lake
mlflowUri: http://mlflow-tracking.ml.svc.cluster.local:5000
secretName: data-pipeline-secret

cron:
  enabled: false
  schedule: "0 2 * * *"
