# Keyed by the app's own name so the write-back rule (<app>.image.tag) is the
# same for every app.
ml-volume-model:
  image:
    repository: gitea.ops-ahead.localtest.me/ops-ahead/ml-volume-model
    tag: latest
    pullPolicy: IfNotPresent

job:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    clickhouseHost: clickhouse.data.svc.cluster.local
    clickhouseUser: ops_ahead
    clickhouseDatabase: default
    mlflowTrackingUri: http://mlflow-tracking.ml.svc.cluster.local:5000
    mlflowExperimentName: volume-forecast
    mlflowRegisteredModelName: volume-forecast
    # trainEnd/validationEnd/holdoutEnd deliberately not set here — they come
    # from the shared infra/apps/ml-temporal-split-values.yaml, layered in by
    # the ArgoCD Application, so this and ml-breach-model can never drift
    # apart on the split boundaries.
    autoPromote: "true"
  secretName: ml-volume-model-secret
