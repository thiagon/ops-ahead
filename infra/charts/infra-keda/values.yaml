# KEDA already defaults to watching every namespace (watchNamespace: "") and
# 1 replica per component. The operator's own ServiceAccount is what creates
# Jobs from ScaledJobs in ns:ml/ns:data — platform infra, never application
# code (see conductor/tracks/exec-trigger_20260807/spec.md).
keda:
  # We only ever use ScaledJob (Kafka lag → Job), never ScaledObject/HPA — the
  # metrics-apiserver component exists to serve the external.metrics.k8s.io
  # API to the HPA, which nothing in this stack uses. Skipping it also avoids
  # its default 1-CPU limit, which the infra namespace's shared ResourceQuota
  # (limits.cpu: 16, already ~95% used by the rest of the platform) had no
  # headroom for.
  metricsServer:
    enabled: false
  # Admission validation is worth keeping, but its 1-CPU default limit is
  # more than this dev cluster can spare — same quota pressure as above.
  resources:
    webhooks:
      limits:
        cpu: 250m
        memory: 250Mi
      requests:
        cpu: 50m
        memory: 50Mi
