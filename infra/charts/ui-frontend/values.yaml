# Chart defaults — image repo, resources. App env + public hosts live in
# apps/ui-frontend/chart/ (values-prod / values-local / values-dev).
ui-frontend:
  image:
    repository: gitea.ops-ahead.localtest.me/ops-ahead/ui-frontend
    tag: latest
    pullPolicy: IfNotPresent

frontend:
  replicaCount: 1
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  secretName: ui-frontend-secret

monitoring:
  enabled: true
