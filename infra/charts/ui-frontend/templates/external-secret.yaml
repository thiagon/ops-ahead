apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.frontend.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.frontend.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: clickhouse-password
      remoteRef: { key: ui-frontend, property: CLICKHOUSE_PASSWORD }
