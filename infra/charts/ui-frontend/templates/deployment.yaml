apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ui-frontend.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: ui
    {{- include "ui-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
        {{- include "ui-frontend.labels" . | nindent 8 }}
    spec:
      serviceAccountName: ui-frontend
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: {{ include "ui-frontend.image" . | quote }}
          imagePullPolicy: {{ (index .Values "ui-frontend").image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.frontend.port | quote }}
            - name: SERVICE_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.frontend.env.clickhouseUser | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.secretName }}
                  key: clickhouse-password
            # @clickhouse/client speaks the HTTP interface (8123), not the
            # native protocol ml-trainer's clickhouse_driver uses (9000).
            - name: CLICKHOUSE_URL
              value: "http://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@{{ .Values.frontend.env.clickhouseHost }}:8123/{{ .Values.frontend.env.clickhouseDatabase }}"
            # Configuration registry this app owns (ui-postgres). Nothing else
            # reads or writes it — see apps/ui-frontend/prisma/schema.prisma.
            - name: UI_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.configDatabase.secretName }}
                  key: POSTGRES_USER
            - name: UI_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.configDatabase.secretName }}
                  key: POSTGRES_PASSWORD
            - name: UI_POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.configDatabase.secretName }}
                  key: POSTGRES_DB
            - name: CONFIG_DATABASE_URL
              value: postgres://$(UI_POSTGRES_USER):$(UI_POSTGRES_PASSWORD)@{{ .Values.frontend.configDatabase.host }}/$(UI_POSTGRES_DB)
            # Where a customer's origin system reaches the gateway from
            # outside the cluster, which is what the integration screen shows
            # them to configure on their side.
            - name: PUBLIC_GATEWAY_URL
              value: {{ .Values.frontend.env.publicGatewayUrl | quote }}
            # The same gateway from inside the cluster — what the loaders call
            # to ask who is signed in.
            - name: GATEWAY_URL
              value: {{ .Values.frontend.env.gatewayUrl | quote }}
            - name: ML_MODEL_SERVING_URL
              value: {{ .Values.frontend.env.mlModelServingUrl | quote }}
            - name: ML_MODEL_SERVING_TIMEOUT_MS
              value: {{ .Values.frontend.env.mlModelServingTimeoutMs | quote }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
