{{- if .Values.networkPolicy.enabled }}
# ns:ui — accepts ingress from Traefik (kube-system); egress to ClickHouse
# and MLflow-adjacent serving in ns:data/ns:ml. The matching ingress side
# lives in infra/apps/namespaces.yaml, where cross-namespace flows are
# declared for the target namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-default
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # data: ClickHouse HTTP interface — the loader reads gold + silver from it.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - port: {{ .Values.networkPolicy.clickhousePort }}
    # ml: ml-model-serving, for the breach score alongside consumed_ratio.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml
      ports:
        - port: {{ .Values.networkPolicy.mlModelServingPort }}
    - to:
        - podSelector: {}
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
{{- end }}
