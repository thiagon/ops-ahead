{{- if .Values.networkPolicy.enabled }}
# ns:data — accepts ingress from ns:ml and ns:llm only
# ns:ui is explicitly blocked from reaching data services directly
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-default
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
      ports:
        - port: 8200
    - to:
        - podSelector: {}
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
{{- end }}
