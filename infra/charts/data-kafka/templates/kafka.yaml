{{- if .Values.kafka.enabled }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: {{ .Release.Namespace }}
  labels:
    strimzi.io/cluster: ops-ahead
    {{- include "data-kafka.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.kafka.cluster.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        {{- if eq .Values.kafka.cluster.storage.type "ephemeral" }}
        type: ephemeral
        {{- else }}
        type: persistent-claim
        size: {{ .Values.kafka.cluster.storage.size }}
        {{- end }}
        kraftMetadata: shared
  resources:
    {{- toYaml .Values.kafka.cluster.resources | nindent 4 }}
  jvmOptions:
    {{- toYaml .Values.kafka.cluster.jvmOptions | nindent 4 }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: ops-ahead
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-kafka.labels" . | nindent 4 }}
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      log.retention.ms: {{ .Values.kafka.cluster.retention.ms | quote }}
      # Internal-topic replication must not exceed the broker count, or the
      # __consumer_offsets topic never gets created and consumers loop on
      # GroupCoordinatorNotAvailableError. Derive both from the replica count.
      offsets.topic.replication.factor: {{ .Values.kafka.cluster.replicas }}
      transaction.state.log.replication.factor: {{ .Values.kafka.cluster.replicas }}
      transaction.state.log.min.isr: 1
      default.replication.factor: {{ .Values.kafka.cluster.replicas }}
      min.insync.replicas: 1
    {{- if .Values.monitoring.enabled }}
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    {{- end }}
  entityOperator:
    topicOperator: {}
    userOperator: {}
{{- end }}
