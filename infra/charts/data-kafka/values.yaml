# ─── Kafka cluster ────────────────────────────────────────────────────────────
kafka:
  enabled: true
  cluster:
    replicas: 3
    storage:
      type: persistent-claim
      size: 20Gi
    retention:
      ms: "604800000"   # 7 days
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 2000m
    jvmOptions:
      "-Xms": "512m"
      "-Xmx": "1g"
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 5Gi

kafkaTopics:
  - name: incidents.received
    partitions: 12
    replicas: 2
    config:
      retention.ms: "604800000"   # 7 days
  - name: incidents.scored
    partitions: 3
    replicas: 2
  - name: alerts.burst
    partitions: 3
    replicas: 2
  - name: recommendations
    partitions: 3
    replicas: 2
  - name: actions.taken
    partitions: 3
    replicas: 2
  - name: trigger.requests
    partitions: 3
    replicas: 2

argoWorkflows:
  enabled: false

monitoring:
  enabled: true

networkPolicy:
  enabled: false
