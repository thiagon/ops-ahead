# ─── Kafka cluster ────────────────────────────────────────────────────────────
kafka:
  enabled: true
  cluster:
    replicas: 3
    storage:
      size: 20Gi
    retention:
      ms: "604800000"   # 7 days
  zookeeper:
    replicas: 3
    storage:
      size: 5Gi

kafkaTopics:
  - name: incidents.raw
    partitions: 3
    replicas: 2
  - name: incidents.scored
    partitions: 3
    replicas: 2
  - name: alerts.burst
    partitions: 3
    replicas: 2
  - name: recommendations
    partitions: 3
    replicas: 2
  - name: actions.taken
    partitions: 3
    replicas: 2

argoWorkflows:
  enabled: false

networkPolicy:
  enabled: true
