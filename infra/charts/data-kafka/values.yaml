# ─── Kafka cluster ────────────────────────────────────────────────────────────
kafka:
  enabled: true
  cluster:
    replicas: 3
    storage:
      type: persistent-claim
      size: 20Gi
    retention:
      ms: "604800000"   # 7 days
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 2000m
    jvmOptions:
      "-Xms": "512m"
      "-Xmx": "1g"
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 5Gi

kafkaTopics:
  # Raw, one per intake — only data-ingest reads these, translating into the
  # topics below (docs/insights/fluxo-do-incidente.md). Retention only needs
  # to outlive the consumer: the lake (MinIO Parquet) is what reprocessing
  # reads, not this topic.
  - name: events.raw.alert
    partitions: 12
    replicas: 2
    config:
      retention.ms: "604800000"   # 7 days
  - name: events.raw.monitor
    partitions: 12
    replicas: 2
    config:
      retention.ms: "604800000"   # 7 days
  # Translated — every business consumer downstream of translation reads
  # these, never the raw topics above.
  - name: events.alert
    partitions: 12
    replicas: 2
    config:
      retention.ms: "604800000"   # 7 days
  - name: events.monitor
    partitions: 12
    replicas: 2
    config:
      retention.ms: "604800000"   # 7 days
  - name: incidents.scored
    partitions: 3
    replicas: 2
  - name: alerts.burst
    partitions: 3
    replicas: 2
  # Append, not compacted: an incident crosses up to five milestones
  # (pct_25/50/75/100/abandoned) and every one of them is its own training
  # row in Predição (incident × marco) — compaction on the incident's key
  # would erase all but the last.
  - name: deadlines.milestone
    partitions: 3
    replicas: 2
    config:
      retention.ms: "604800000"   # 7 days
  - name: recommendations
    partitions: 3
    replicas: 2
  - name: actions.taken
    partitions: 3
    replicas: 2
  # One topic per domain — KEDA's ScaledObject scales by queue volume, not
  # message content, so it can't route by `analysis` itself (see
  # conductor/tracks/exec-trigger_20260807/spec.md).
  - name: trigger.ml
    partitions: 3
    replicas: 2
  - name: trigger.data
    partitions: 3
    replicas: 2
  # Compacted leftover from when status lived only on this topic. Trainers
  # now PATCH /analyses/{id}; the topic stays so an existing cluster is not
  # asked to delete it.
  - name: trigger.status
    partitions: 3
    replicas: 2
    config:
      cleanup.policy: compact
  # Configuration, compacted and never deleted: a consumer that starts from
  # zero rebuilds the whole current state by reading the log, so a service
  # without its configuration fails readiness instead of running on a stale
  # or embedded default (apps/ui-frontend/spec/config-ui.md).
  # Keyed <tenant_id>:<source> — one record per origin.
  - name: config.origin
    partitions: 3
    replicas: 2
    config:
      cleanup.policy: compact
  - name: config.dictionary
    partitions: 3
    replicas: 2
    config:
      cleanup.policy: compact
  # Keyed <tenant_id> — one record per tenant.
  - name: config.deadline
    partitions: 3
    replicas: 2
    config:
      cleanup.policy: compact
  - name: config.kpi-target
    partitions: 3
    replicas: 2
    config:
      cleanup.policy: compact

monitoring:
  enabled: true

networkPolicy:
  enabled: false
