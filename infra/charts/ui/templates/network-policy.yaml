{{- if .Values.networkPolicy.enabled }}
# ns:ui — accepts ingress from Traefik (kube-system); egress to agent/ml API ports
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-default
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml
    - to:
        - podSelector: {}
  ingress:
    - from:
        - podSelector: {}
    # Traefik ingress controller lives in kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
{{- end }}
