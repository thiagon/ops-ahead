{{- if .Values.networkPolicy.enabled }}
# ns:ui — accepts ingress from Traefik (kube-system); egress to agent/ml API ports
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-default
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # agent: LiteLLM proxy (4000)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent
      ports:
        - port: 4000
    # ml: MLflow API (5000)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml
      ports:
        - port: 5000
    - to:
        - podSelector: {}
  ingress:
    - from:
        - podSelector: {}
    # Traefik ingress controller lives in kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
{{- end }}
