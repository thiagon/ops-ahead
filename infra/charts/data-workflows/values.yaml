argo-workflows:
  controller:
    replicas: 1
  server:
    replicas: 1
    authModes:
      - server

argoWorkflows:
  rbac:
    enabled: false

pipeline:
  dbtImage: gitea.ops-ahead.local/ops-ahead/data-transform:latest
  dataQualityImage: gitea.ops-ahead.local/ops-ahead/data-quality:latest
  clickhouseHost: clickhouse.data.svc.cluster.local
  clickhouseDatabase: default
  minioEndpoint: http://minio.infra.svc.cluster.local:9000
  minioBucket: ops-ahead-lake
  mlflowUri: http://mlflow.ml.svc.cluster.local:5000
  secretName: data-pipeline-secret
  cron:
    enabled: false
    schedule: "0 2 * * *"
