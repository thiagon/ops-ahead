# Loki e Promtail desabilitados no umbrella chart (bug de schema validation no v6)
# Instalar separadamente: helm install ops-ahead-loki grafana/loki --set loki.loki.useTestSchema=true
loki:
  enabled: false

promtail:
  enabled: false

argo-cd:
  configs:
    secret:
      argocdServerAdminPassword: "$2b$10$jZtODvAvDeVS0lOxMZLX1OGDkdErQgJtrXgHZEFkwEBe7F7XmBWdy"
      argocdServerAdminPasswordMtime: "2026-01-01T00:00:00Z"

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 24h
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
  alertmanager:
    enabled: true
  grafana:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
