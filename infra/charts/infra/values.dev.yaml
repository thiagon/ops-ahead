# Loki e Promtail desabilitados no umbrella chart (bug de schema validation no v6)
# Instalar separadamente: helm install ops-ahead-loki grafana/loki --set loki.loki.useTestSchema=true
loki:
  enabled: false

promtail:
  enabled: false

vault:
  ui:
    enabled: true
  server:
    dev:
      enabled: true      # in-memory, auto-unsealed — só para dev
      devRootToken: "PLACEHOLDER"  # sobrescrito via --set no dev-up.sh
    standalone:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  injector:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 24h
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
  alertmanager:
    enabled: true
  grafana:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
