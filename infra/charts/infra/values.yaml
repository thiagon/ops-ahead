# ─── ArgoCD ──────────────────────────────────────────────────────────────────
argocd:
  enabled: true
  app:
    repoURL: https://github.com/thiagon/ops-ahead
    targetRevision: main
    path: infra/overlays/dev

argo-cd:
  server:
    replicas: 1
  repoServer:
    replicas: 1
  applicationSet:
    replicas: 1
  configs:
    params:
      server.insecure: "true"
  notifications:
    enabled: false

# ─── Prometheus + Grafana (kube-prometheus-stack) ────────────────────────────
prometheus:
  enabled: true

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 24h
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector:
        matchLabels:
          ops-ahead/monitor: "true"
  alertmanager:
    alertmanagerSpec:
      replicas: 1
  grafana:
    enabled: true
    adminPassword: ops-ahead-dev
    persistence:
      enabled: false
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://ops-ahead-infra-loki:3100

# ─── Loki (single-binary) ─────────────────────────────────────────────────────
loki:
  enabled: true
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    storage:
      type: filesystem
  singleBinary:
    replicas: 1
    persistence:
      size: 2Gi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

# ─── Promtail (DaemonSet) ─────────────────────────────────────────────────────
promtail:
  enabled: true
  config:
    clients:
      - url: http://ops-ahead-infra-loki:3100/loki/api/v1/push
