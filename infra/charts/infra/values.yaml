# ─── ArgoCD ──────────────────────────────────────────────────────────────────
argocd:
  enabled: true
  app:
    repoURL: https://github.com/thiagon/ops-ahead
    targetRevision: main
    path: infra/apps

argo-cd:
  server:
    replicas: 1
  repoServer:
    replicas: 1
  applicationSet:
    replicas: 1
  configs:
    params:
      server.insecure: "true"
    # argocd-secret é provisionado externamente (dev-up.sh em dev, ESO em prod)
    secret:
      createSecret: false
  notifications:
    enabled: false

# ─── Vault ────────────────────────────────────────────────────────────────────
vault:
  enabled: true
  injector:
    enabled: true
  server:
    dev:
      enabled: false
    standalone:
      enabled: true
    ha:
      enabled: false

# ─── Gitea ────────────────────────────────────────────────────────────────────
# Disabled by default — só ativado em dev via values-dev.yaml.
# Em prod, ArgoCD aponta direto pro GitHub.
gitea:
  enabled: false
