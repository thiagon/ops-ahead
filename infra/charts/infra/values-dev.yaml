vault:
  ui:
    enabled: true
  server:
    dev:
      enabled: true        # in-memory, auto-unsealed — só para dev
      # devRootToken passado via --set pelo dev-up.sh (vem do .env / VAULT_TOKEN)
    standalone:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  injector:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

