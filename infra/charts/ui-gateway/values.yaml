# Chart defaults — image repo, resources, wiring. App env + public hosts live in
# apps/ui-gateway/chart/ (values-prod / values-local / values-dev).
ui-gateway:
  image:
    repository: gitea.ops-ahead.localtest.me/ops-ahead/ui-gateway
    tag: latest
    pullPolicy: IfNotPresent

gateway:
  replicaCount: 1
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  secretName: ui-gateway-secret
  analysesDatabase:
    host: config-postgres.ui.svc.cluster.local:5432
    name: gateway
    secretName: postgres-config-secret

networkPolicy:
  enabled: true
  kafkaPort: 9092
  clickhousePort: 8123
  authentikPort: 9000
  mlModelServingPort: 3000

monitoring:
  enabled: true
