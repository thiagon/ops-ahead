# Keyed by the app's own name so the write-back rule (<app>.image.tag) is the
# same for every app.
ui-gateway:
  image:
    repository: gitea.ops-ahead.localtest.me/ops-ahead/ui-gateway
    tag: latest
    pullPolicy: IfNotPresent

gateway:
  replicaCount: 1
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    appEnv: dev
    logLevel: info
    serviceName: gateway
    kafkaBootstrapServers: ops-ahead-kafka-bootstrap.data.svc.cluster.local:9092
    kafkaTopicRawAlert: events.raw.alert
    kafkaTopicRawMonitor: events.raw.monitor
    kafkaTopicRulesMapping: rules.mapping
    kafkaTopicRulesDeadline: rules.deadline
    kafkaTopicRulesTarget: rules.target
    kafkaTopicMl: trigger.ml
    kafkaTopicData: trigger.data
    hmacEnabled: "true"
    httpsEnabled: "false"
    corsOrigins:
      - http://ui.ops-ahead.localtest.me
  secretName: ui-gateway-secret
  ingress:
    host: gateway.ops-ahead.localtest.me
  # Same instance as ui-frontend (config-postgres); a different database on it.
  analysesDatabase:
    host: config-postgres.ui.svc.cluster.local:5432
    name: gateway
    secretName: postgres-config-secret

networkPolicy:
  enabled: true
  # Kafka's plain internal listener.
  kafkaPort: 9092
  # ClickHouse HTTP interface — ui-frontend's gold/silver loaders.
  clickhousePort: 8123
  # ml-model-serving — the breach score ui-frontend's operator queue reads.
  mlModelServingPort: 3000

monitoring:
  enabled: true
