# Keyed by the app's own name so the write-back rule (<app>.image.tag) is the
# same for every app.
ui-gateway:
  image:
    repository: gitea.ops-ahead.localtest.me/ops-ahead/ui-gateway
    tag: latest
    pullPolicy: IfNotPresent

gateway:
  replicaCount: 1
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    appEnv: dev
    logLevel: info
    serviceName: gateway
    kafkaBootstrapServers: ops-ahead-kafka-bootstrap.data.svc.cluster.local:9092
    kafkaTopicRawAlert: events.raw.alert
    kafkaTopicRawMonitor: events.raw.monitor
    kafkaTopicRulesMapping: rules.mapping
    kafkaTopicRulesDeadline: rules.deadline
    kafkaTopicRulesTarget: rules.target
    kafkaTopicMl: trigger.ml
    kafkaTopicData: trigger.data
    hmacEnabled: "true"
    httpsEnabled: "false"
    corsOrigins:
      - http://ui.ops-ahead.localtest.me
    authentikIssuer: http://auth.ops-ahead.localtest.me/application/o/gateway-web/
    # The issuer host has to be one name: the gateway reads the discovery
    # document from it, and hands the `authorization_endpoint` it finds there
    # to the browser. `localtest.me` resolves to 127.0.0.1, which inside the
    # pod is the pod itself — so the name is pinned to Traefik, which serves
    # the same ingress the browser reaches. hostAliases takes an address, not
    # a Service name, and this is the Traefik ClusterIP in dev.
    authentikHostAlias:
      ip: 10.43.30.165
      host: auth.ops-ahead.localtest.me
    authentikClientId: gateway-web
    authentikMcpClientId: gateway-mcp
    introspectionCacheTtlMs: "5000"
    frontendOrigin: http://ui.ops-ahead.localtest.me
    publicUrl: http://gateway.ops-ahead.localtest.me
  secretName: ui-gateway-secret
  ingress:
    host: gateway.ops-ahead.localtest.me
  # Same instance as ui-frontend (config-postgres); a different database on it.
  analysesDatabase:
    host: config-postgres.ui.svc.cluster.local:5432
    name: gateway
    secretName: postgres-config-secret

networkPolicy:
  enabled: true
  # Kafka's plain internal listener.
  kafkaPort: 9092
  # ClickHouse HTTP interface — ui-frontend's gold/silver loaders.
  clickhousePort: 8123
  # Authentik server — introspection and the token endpoint.
  authentikPort: 9000
  # ml-model-serving — the breach score ui-frontend's operator queue reads.
  mlModelServingPort: 3000

monitoring:
  enabled: true
