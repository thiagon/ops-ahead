apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.gateway.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Created before the Deployment (wave 0) so the gateway can mount it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.gateway.secretName }}
    creationPolicy: Owner
  data:
    # Shared with whoever signs the webhook — scripts/incident_producer.py in dev.
    # One property per (tenant, source) credential — sources/registry.ts names
    # which env var, and therefore which property here, each credential reads.
    - secretKey: HMAC_SECRET_LOCAWEB_ITSM
      remoteRef: { key: gateway, property: HMAC_SECRET_LOCAWEB_ITSM }
