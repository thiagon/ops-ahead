apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.gateway.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Created before the Deployment (wave 0) so the gateway can mount it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.gateway.secretName }}
    creationPolicy: Owner
  data:
    # Every accepted origin and the secret it signs with — added by hand for
    # now, one JSON object keyed <tenant>:<source>.
    - secretKey: ORIGINS
      remoteRef: { key: gateway, property: ORIGINS }
