apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.gateway.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Created before the Deployment (wave 0) so the gateway can mount it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.gateway.secretName }}
    creationPolicy: Owner
  data:
    # Decrypts the webhook secrets in the sources table. One key for the whole
    # table, so registering a source never writes here.
    - secretKey: SOURCE_SECRET_KEY
      remoteRef: { key: gateway, property: SOURCE_SECRET_KEY }
    # Encrypts the tokens the browser cookie carries: the gateway keeps no
    # session row, so the cookie is the storage.
    - secretKey: SESSION_COOKIE_KEY
      remoteRef: { key: gateway, property: SESSION_COOKIE_KEY }
    - secretKey: AUTHENTIK_CLIENT_SECRET
      remoteRef: { key: gateway, property: AUTHENTIK_CLIENT_SECRET }
    # The same key the CronJob presents, registered here at startup so one
    # Vault value serves both sides.
    - secretKey: SCHEDULER_API_KEY
      remoteRef: { key: gateway, property: SCHEDULER_API_KEY }
