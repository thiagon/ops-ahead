apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.gateway.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Created before the Deployment (wave 0) so the gateway can mount it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.gateway.secretName }}
    creationPolicy: Owner
  data:
    # Decrypts the webhook secrets in the sources table. One key for the whole
    # table, so registering a source never writes here.
    - secretKey: SOURCE_SECRET_KEY
      remoteRef: { key: gateway, property: SOURCE_SECRET_KEY }
