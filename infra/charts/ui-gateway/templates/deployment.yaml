apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ui-gateway.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
    {{- include "ui-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        {{- include "ui-gateway.labels" . | nindent 8 }}
    spec:
      serviceAccountName: ui-gateway
      automountServiceAccountToken: false
      {{- with .Values.gateway.env.authentikHostAlias }}
      hostAliases:
        - ip: {{ .ip | quote }}
          hostnames:
            - {{ .host | quote }}
      {{- end }}
      # The 'gateway' Service would otherwise inject legacy GATEWAY_* env vars
      # into its own pods; the app reads its config from the env schema only.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # 'node' in node:24-trixie-slim.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "ui-gateway.image" . | quote }}
          imagePullPolicy: {{ (index .Values "ui-gateway").image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ENV
              value: {{ .Values.gateway.env.appEnv | quote }}
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.gateway.env.logLevel | quote }}
            - name: SERVICE_NAME
              value: {{ .Values.gateway.env.serviceName | quote }}
            - name: SERVICE_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: HTTPS_ENABLED
              value: {{ .Values.gateway.env.httpsEnabled | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.gateway.env.corsOrigins | toJson | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.gateway.env.kafkaBootstrapServers | quote }}
            - name: KAFKA_TOPIC_RAW_ALERT
              value: {{ .Values.gateway.env.kafkaTopicRawAlert | quote }}
            - name: KAFKA_TOPIC_RAW_MONITOR
              value: {{ .Values.gateway.env.kafkaTopicRawMonitor | quote }}
            - name: KAFKA_TOPIC_RULES_MAPPING
              value: {{ .Values.gateway.env.kafkaTopicRulesMapping | quote }}
            - name: KAFKA_TOPIC_RULES_DEADLINE
              value: {{ .Values.gateway.env.kafkaTopicRulesDeadline | quote }}
            - name: KAFKA_TOPIC_RULES_TARGET
              value: {{ .Values.gateway.env.kafkaTopicRulesTarget | quote }}
            - name: KAFKA_TOPIC_ML
              value: {{ .Values.gateway.env.kafkaTopicMl | quote }}
            - name: KAFKA_TOPIC_DATA
              value: {{ .Values.gateway.env.kafkaTopicData | quote }}
            - name: HMAC_ENABLED
              value: {{ .Values.gateway.env.hmacEnabled | quote }}
            - name: AUTHENTIK_ISSUER
              value: {{ .Values.gateway.env.authentikIssuer | quote }}
            - name: AUTHENTIK_CLIENT_ID
              value: {{ .Values.gateway.env.authentikClientId | quote }}
            - name: AUTHENTIK_MCP_CLIENT_ID
              value: {{ .Values.gateway.env.authentikMcpClientId | quote }}
            - name: INTROSPECTION_CACHE_TTL_MS
              value: {{ .Values.gateway.env.introspectionCacheTtlMs | quote }}
            - name: FRONTEND_ORIGIN
              value: {{ .Values.gateway.env.frontendOrigin | quote }}
            - name: PUBLIC_URL
              value: {{ .Values.gateway.env.publicUrl | quote }}
            - name: SESSION_COOKIE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.secretName }}
                  key: SESSION_COOKIE_KEY
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.secretName }}
                  key: AUTHENTIK_CLIENT_SECRET
            - name: SCHEDULER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.secretName }}
                  key: SCHEDULER_API_KEY
            - name: UI_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.analysesDatabase.secretName }}
                  key: POSTGRES_USER
            - name: UI_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.analysesDatabase.secretName }}
                  key: POSTGRES_PASSWORD
            - name: GATEWAY_DATABASE_URL
              value: postgres://$(UI_POSTGRES_USER):$(UI_POSTGRES_PASSWORD)@{{ .Values.gateway.analysesDatabase.host }}/{{ .Values.gateway.analysesDatabase.name }}
            - name: SOURCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.secretName }}
                  key: SOURCE_SECRET_KEY
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # The root filesystem is read-only; Node still wants a scratch dir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
