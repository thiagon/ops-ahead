image: postgres:16-alpine

# Additional databases on this instance. POSTGRES_DB (from the secret) is the
# one the image creates at first init; each name here is CREATE DATABASE'd by
# the chart Job once the StatefulSet accepts connections.
extraDatabases:
  - gateway
  - authentik

monitoring:
  enabled: true

primary:
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
