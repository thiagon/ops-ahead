kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 1h
      retentionSize: 1500MB
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
  alertmanager:
    enabled: true
  grafana:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # k3d roda o control plane num processo só: o /metrics do kubelet reexpõe as
  # séries do apiserver, que assim entram duas vezes. Só cadvisor e probes.
  kubelet:
    serviceMonitor:
      resource: false
      cAdvisor: true
      probes: true
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "(apiserver|etcd|workqueue)_.*_bucket"
          action: drop
  kubeApiServer:
    serviceMonitor:
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "(apiserver|etcd|workqueue)_.*_bucket"
          action: drop
