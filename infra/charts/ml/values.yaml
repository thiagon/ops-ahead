# ─── MLflow ───────────────────────────────────────────────────────────────────
mlflow:
  # Imagem comunidade que já vem com psycopg2-binary + boto3 instalados
  # (evita pip install em runtime que falha em pods sem internet)
  image: burakince/mlflow:2.20.0
  replicas: 1
  artifactRoot: s3://ops-ahead-lake/mlflow
  minio:
    endpoint: http://minio.data.svc.cluster.local:9000
    accessKey: ""
    secretKey: ""

# ─── Postgres (bitnami — backend do MLflow) ──────────────────────────────────
mlflow-postgres:
  enabled: true
  auth:
    username: mlflow
    database: mlflow
    existingSecret: mlflow-postgres-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      size: 10Gi

# ─── Redis ───────────────────────────────────────────────────────────────────
redis:
  enabled: true
  master:
    persistence:
      size: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

networkPolicy:
  enabled: true
