apiVersion: v2
name: ops-ahead-ml
description: Ops Ahead ml namespace — MLflow + Postgres, Redis
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: "15.5.17"
    repository: "https://charts.bitnami.com/bitnami"
    alias: mlflow-postgres
    condition: mlflow.postgres.enabled
  - name: redis
    version: "19.6.2"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
