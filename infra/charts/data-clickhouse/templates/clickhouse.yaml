{{- if .Values.clickhouse.operatorEnabled }}
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: ops-ahead
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-clickhouse.labels" . | nindent 4 }}
spec:
  configuration:
    users:
      {{- if .Values.clickhouse.devPassword }}
      # Dev: deterministic password so it always matches ops-ahead-dev. The
      # operator's k8s_secret_password generated a stale hash when ESO was down
      # at CHI creation and never re-read the secret.
      ops_ahead/password_sha256_hex: {{ .Values.clickhouse.devPassword | sha256sum }}
      {{- else }}
      ops_ahead/k8s_secret_password:
        namespace: {{ .Release.Namespace }}
        name: clickhouse-secret
        key: CLICKHOUSE_PASSWORD
      {{- end }}
      ops_ahead/networks/ip:
        - "::/0"
        - "0.0.0.0/0"
      ops_ahead/profile: default
      ops_ahead/quota: default
      default/networks/ip:
        - "127.0.0.1"
        - "::1"
      default/password: ""
    clusters:
      - name: ops-ahead
        layout:
          shardsCount: {{ .Values.clickhouse.cluster.shards }}
          replicasCount: {{ .Values.clickhouse.cluster.replicas }}
    settings:
      max_connections: "100"
      max_concurrent_queries: "50"
      keep_alive_timeout: "3"
      # Explicit cap: ClickHouse otherwise auto-derives the limit from the
      # memory *request* (0.9 ratio), not the container limit, capping itself
      # at ~460 MiB on a 512 MiB request and OOMing trivial queries.
      max_server_memory_usage: {{ .Values.clickhouse.cluster.maxServerMemoryUsage | quote }}
      {{- if .Values.monitoring.enabled }}
      prometheus/endpoint: /metrics
      prometheus/port: "9363"
      prometheus/metrics: "true"
      prometheus/events: "true"
      prometheus/asynchronous_metrics: "true"
      {{- end }}
  templates:
    volumeClaimTemplates:
      - name: data-volume
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ .Values.clickhouse.cluster.storage.size }}
    podTemplates:
      - name: default
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.3-alpine
              # ClickHouse derives its memory ceiling from the *request* (it
              # reads it as available RAM), so the request must be generous
              # enough or max_server_memory_usage gets cut down below idle RSS.
              resources:
                {{- toYaml .Values.clickhouse.resources | nindent 16 }}
              ports:
                - name: http
                  containerPort: 8123
                - name: native
                  containerPort: 9000
                {{- if .Values.monitoring.enabled }}
                - name: prometheus
                  containerPort: 9363
                {{- end }}
              readinessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 10
                periodSeconds: 10
                failureThreshold: 5
              livenessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 30
                periodSeconds: 15
              volumeMounts:
                - name: data-volume
                  mountPath: /var/lib/clickhouse
{{- end }}
