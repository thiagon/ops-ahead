apiVersion: v1
kind: Service
metadata:
  name: {{ include "ml-burst-detector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ml-burst-detector.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "ml-burst-detector.fullname" . }}
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
