apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.consumer.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.consumer.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: ml-burst-detector, property: REDIS_PASSWORD }
