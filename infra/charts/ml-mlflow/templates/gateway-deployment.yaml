apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: mlflow-gateway
    {{- include "ml-mlflow.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-gateway
  template:
    metadata:
      labels:
        app: mlflow-gateway
    spec:
      volumes:
        - name: gateway-config
          configMap:
            name: mlflow-gateway-config
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ .Values.mlflow.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - /bin/bash
            - -c
            - >-
              mlflow gateway start
              --config-path /etc/mlflow/gateway-config.yaml
              --host 0.0.0.0
              --port 7000
          envFrom:
            - secretRef:
                name: mlflow-llm-keys
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/mlflow
              readOnly: true
          ports:
            - containerPort: 7000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: mlflow-gateway
    {{- include "ml-mlflow.labels" . | nindent 4 }}
spec:
  selector:
    app: mlflow-gateway
  ports:
    - name: http
      port: 7000
      targetPort: 7000
