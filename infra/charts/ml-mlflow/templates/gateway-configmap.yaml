apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-gateway-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ml-mlflow.labels" . | nindent 4 }}
data:
  gateway-config.yaml: |
    endpoints:
      - name: chat
        endpoint_type: llm/v1/chat
        model:
          provider: anthropic
          name: claude-sonnet-4-6
          config:
            anthropic_api_key: $ANTHROPIC_API_KEY

      - name: chat-openai
        endpoint_type: llm/v1/chat
        model:
          provider: openai
          name: gpt-4.1
          config:
            openai_api_key: $OPENAI_API_KEY

      - name: embeddings
        endpoint_type: llm/v1/embeddings
        model:
          provider: openai
          name: text-embedding-3-small
          config:
            openai_api_key: $OPENAI_API_KEY

