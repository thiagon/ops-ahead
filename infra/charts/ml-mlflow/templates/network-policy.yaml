{{- if .Values.networkPolicy.enabled }}
# ns:ml — accepts from ns:ui (API port only); infra for metrics
# Direct access to ClickHouse in ns:data is governed by ns:data policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ml-default
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # data: MinIO S3 (9000), Kafka plaintext/TLS (9092/9093), ClickHouse HTTP (8123)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - port: 9000
        - port: 9092
        - port: 9093
        - port: 8123
    # ui: ml-trainer reporta o status de cada run em PATCH /analyses/{id}.
    # Sem isto o treino roda e termina, mas o gateway nunca fica sabendo — a
    # execucao fica presa em `pending` para quem consulta.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ui
      ports:
        - port: 3000
    # Mesmo namespace: Postgres (5432), Redis (6379)
    - to:
        - podSelector: {}
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ui
      ports:
        - port: 5000   # MLflow API only
        - port: 80
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
    # Allow from kube-system (Traefik ingress controller)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
{{- end }}
