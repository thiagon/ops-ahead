apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-tracking
  namespace: {{ .Release.Namespace }}
  labels:
    app: mlflow
    {{- include "ml-mlflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mlflow.replicas }}
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
          command:
            - /bin/sh
            - -c
            - |
              until nc -z {{ include "ml-mlflow.postgresHost" . }} 5432; do
                echo "Waiting for Postgres..."; sleep 3
              done
      securityContext:
        runAsNonRoot: false  # imagem oficial do mlflow roda como root
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: {{ .Values.mlflow.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - /bin/bash
            - -c
            - >-
              mlflow server
              --backend-store-uri postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "ml-mlflow.postgresHost" . }}:5432/$(POSTGRES_DB)
              --artifacts-destination {{ .Values.mlflow.artifactRoot }}
              --host 0.0.0.0
              --port 5000
          envFrom:
            - secretRef:
                name: mlflow-secret
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
