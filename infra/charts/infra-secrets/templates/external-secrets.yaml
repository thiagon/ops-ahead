{{- define "es" -}}
{{- $name := index . 0 -}}
{{- $ns := index . 1 -}}
{{- $vaultPath := index . 2 -}}
{{- $data := index . 3 -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
    {{- range $data }}
    - secretKey: {{ .k }}
      remoteRef:
        key: {{ $vaultPath }}
        property: {{ .v }}
    {{- end }}
{{- end }}
---
{{ include "es" (list "grafana-secret" "infra" "infra-grafana" (list
  (dict "k" "admin-user"     "v" "ADMIN_USER")
  (dict "k" "admin-password" "v" "ADMIN_PASSWORD")
)) }}
---
{{ include "es" (list "minio-secret" "data" "data-minio" (list
  (dict "k" "rootUser"     "v" "ROOT_USER")
  (dict "k" "rootPassword" "v" "ROOT_PASSWORD")
)) }}
---
{{ include "es" (list "llm-postgres-secret" "llm" "llm-postgres" (list
  (dict "k" "postgres-password" "v" "POSTGRES_PASSWORD")
  (dict "k" "password"          "v" "POSTGRES_PASSWORD")
)) }}
---
{{ include "es" (list "litellm-secret" "llm" "llm-litellm" (list
  (dict "k" "ANTHROPIC_API_KEY"  "v" "ANTHROPIC_API_KEY")
  (dict "k" "OPENAI_API_KEY"     "v" "OPENAI_API_KEY")
  (dict "k" "LITELLM_MASTER_KEY" "v" "LITELLM_MASTER_KEY")
)) }}
---
{{ include "es" (list "mlflow-postgres-secret" "ml" "ml-mlflow" (list
  (dict "k" "postgres-password" "v" "POSTGRES_PASSWORD")
  (dict "k" "password"          "v" "POSTGRES_PASSWORD")
)) }}
---
{{ include "es" (list "mlflow-secret" "ml" "ml-mlflow" (list
  (dict "k" "POSTGRES_USER"           "v" "POSTGRES_USER")
  (dict "k" "POSTGRES_PASSWORD"       "v" "POSTGRES_PASSWORD")
  (dict "k" "POSTGRES_DB"             "v" "POSTGRES_DB")
  (dict "k" "AWS_ACCESS_KEY_ID"       "v" "AWS_ACCESS_KEY_ID")
  (dict "k" "AWS_SECRET_ACCESS_KEY"   "v" "AWS_SECRET_ACCESS_KEY")
  (dict "k" "MLFLOW_S3_ENDPOINT_URL"  "v" "MLFLOW_S3_ENDPOINT_URL")
)) }}
