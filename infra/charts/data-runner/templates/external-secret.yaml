apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.run.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # PreSync, not just an early wave: the whole PreSync phase (this resource)
    # runs before any Sync-phase resource (the Deployment, wave 0, or the
    # data-runner-build hook below) — a wave alone wouldn't order it ahead of
    # a hook. hook-weight "-1" beats that hook's default "0" within the phase.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.run.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: clickhouse-password
      remoteRef: { key: data-runner, property: CLICKHOUSE_PASSWORD }
    - secretKey: minio-access-key
      remoteRef: { key: data-runner, property: MINIO_ROOT_USER }
    - secretKey: minio-secret-key
      remoteRef: { key: data-runner, property: MINIO_ROOT_PASSWORD }
    - secretKey: redis-password
      remoteRef: { key: data-runner, property: REDIS_PASSWORD }
    - secretKey: scheduler-api-key
      remoteRef: { key: data-runner, property: SCHEDULER_API_KEY }
