{{- if .Values.cron.enabled }}
# Native CronJob — asks the gateway to start one full_pipeline and exits.
# It goes through POST /analyses like any other client instead of publishing
# to Kafka directly, so the daily run gets a row, a status and an update_key:
# no execution exists that GET /analyses cannot answer for. `trigger` marks it
# as the clock's, which is what tells it apart from a run someone asked for.
# The id is minted by the gateway and printed here.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-runner-daily
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-runner.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: data-runner-daily
            {{- include "data-runner.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: publish
              image: {{ .Values.cron.image | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  curl -sS --fail-with-body -X POST "$GATEWAY_URL/analyses" \
                    -H 'Content-Type: application/json' \
                    -d '{"analysis":"full_pipeline","trigger":"scheduled"}'
              env:
                - name: GATEWAY_URL
                  value: {{ .Values.run.env.gatewayUrl | quote }}
{{- end }}
