{{- if .Values.cron.enabled }}
# Native CronJob — publishes 1 event to trigger.data at the scheduled time
# and exits. Doesn't need the data-runner image at all: a minimal Kafka
# producer image is enough, and this is the only piece of the daily chain
# that still runs on a schedule instead of on demand (see spec.md,
# "Removido nesta revisão"). `run_id` is deterministic (`daily-<date>`), so
# GET /runs/daily-2026-08-16 works without digging through logs for the id.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-runner-daily
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-runner.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: data-runner-daily
            {{- include "data-runner.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: publish
              image: {{ .Values.cron.image | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  RUN_ID="daily-$(date -u +%Y-%m-%d)"
                  printf '%s:{"run_id":"%s","analysis":"full_pipeline"}' "$RUN_ID" "$RUN_ID" \
                    | kcat -P -b "$KAFKA_BOOTSTRAP_SERVERS" -t "$KAFKA_TOPIC" -K:
              env:
                - name: KAFKA_BOOTSTRAP_SERVERS
                  value: {{ .Values.run.env.kafkaBootstrapServers | quote }}
                - name: KAFKA_TOPIC
                  value: {{ .Values.run.env.kafkaTopic | quote }}
{{- end }}
