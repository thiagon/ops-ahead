apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ml-workflow-template
  namespace: {{ .Release.Namespace }}
spec:
  serviceAccountName: argo-workflow-executor
  entrypoint: train
  # Every run is dispatched by trigger-service — these have no static default
  # on purpose (see docs/insights/temporal-split-data-dependency.md): the
  # split boundaries and the image/domain switch always come from the
  # payload of the request that created this Workflow, never from a fixed
  # values.yaml.
  arguments:
    parameters:
      - name: workload   # volume | breach
      - name: train_end
      - name: validation_end
      - name: holdout_end
      - name: clickhouse_url
        value: ""

  templates:
    - name: train
      container:
        image: "{{ (index .Values "ml-trainer").image.repository }}:{{ (index .Values "ml-trainer").image.tag }}"
        # Explicit command: Emissary otherwise looks up the image's ENTRYPOINT
        # from the registry, which isn't reachable over HTTPS here.
        command: ["sh", "-c"]
        args:
          - |
            export CLICKHOUSE_URL="${CLICKHOUSE_URL_OVERRIDE:-$CLICKHOUSE_URL_DEFAULT}"
            exec python -m src.main train "$WORKLOAD"
        env:
          - name: WORKLOAD
            value: "{{`{{workflow.parameters.workload}}`}}"
          - name: TRAIN_END
            value: "{{`{{workflow.parameters.train_end}}`}}"
          - name: VALIDATION_END
            value: "{{`{{workflow.parameters.validation_end}}`}}"
          - name: HOLDOUT_END
            value: "{{`{{workflow.parameters.holdout_end}}`}}"
          - name: CLICKHOUSE_URL_OVERRIDE
            value: "{{`{{workflow.parameters.clickhouse_url}}`}}"
          - name: CLICKHOUSE_USER
            value: {{ .Values.train.env.clickhouseUser | quote }}
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.train.secretName }}
                key: clickhouse-password
          - name: CLICKHOUSE_URL_DEFAULT
            value: "clickhouse://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@{{ .Values.train.env.clickhouseHost }}:9000/{{ .Values.train.env.clickhouseDatabase }}"
          - name: MLFLOW_TRACKING_URI
            value: {{ .Values.train.env.mlflowTrackingUri | quote }}
          - name: AUTO_PROMOTE
            value: {{ .Values.train.env.autoPromote | quote }}
        resources:
          {{- toYaml .Values.train.resources | nindent 12 }}
