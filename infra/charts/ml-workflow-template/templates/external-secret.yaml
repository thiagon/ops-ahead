apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.train.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Created before any Workflow can run against it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.train.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: clickhouse-password
      remoteRef: { key: ml-workflow-template, property: CLICKHOUSE_PASSWORD }
