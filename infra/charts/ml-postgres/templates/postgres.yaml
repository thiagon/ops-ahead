apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mlflow-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: mlflow-postgres
    {{- include "ml-postgres.labels" . | nindent 4 }}
spec:
  serviceName: mlflow-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-postgres
  template:
    metadata:
      labels:
        app: mlflow-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.auth.username }}
            - name: POSTGRES_DB
              value: {{ .Values.auth.database }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKeys.userPasswordKey }}
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            {{- toYaml .Values.primary.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.auth.username | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.auth.username | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.primary.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: mlflow-postgres
    {{- include "ml-postgres.labels" . | nindent 4 }}
spec:
  selector:
    app: mlflow-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-postgres-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app: mlflow-postgres
    {{- include "ml-postgres.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: mlflow-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
