apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-mlflow-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: postgres-mlflow-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef: { key: postgres-mlflow, property: MLFLOW_POSTGRES_USER }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: postgres-mlflow, property: MLFLOW_POSTGRES_PASSWORD }
    - secretKey: POSTGRES_DB
      remoteRef: { key: postgres-mlflow, property: MLFLOW_POSTGRES_DB }
