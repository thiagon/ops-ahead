{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mlflow-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ml-postgres.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: mlflow-postgres
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
{{- end }}
