apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ml-model-serving.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ml-model-serving.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ml-model-serving.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "ml-model-serving.fullname" . }}
        {{- include "ml-model-serving.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.deployment.env.httpPort | quote }}
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: server
          image: "{{ (index .Values "ml-model-serving").image.repository }}:{{ (index .Values "ml-model-serving").image.tag }}"
          imagePullPolicy: {{ (index .Values "ml-model-serving").image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.deployment.env.httpPort }}
          env:
            - name: MLFLOW_TRACKING_URI
              value: {{ .Values.deployment.env.mlflowTrackingUri | quote }}
            - name: VOLUME_MODEL_NAME
              value: {{ .Values.deployment.env.volumeModelName | quote }}
            - name: BREACH_MODEL_NAME
              value: {{ .Values.deployment.env.breachModelName | quote }}
            - name: HTTP_PORT
              value: {{ .Values.deployment.env.httpPort | quote }}
          resources:
            {{- toYaml .Values.deployment.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.deployment.env.httpPort }}
            # Loading two MLflow pyfunc models (LightGBM + Prophet artifacts)
            # is slow enough to need real startup headroom, not just a longer
            # initialDelay on the liveness probe.
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.deployment.env.httpPort }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.deployment.env.httpPort }}
            periodSeconds: 20
