# Keyed by the app's own name so the write-back rule (<app>.image.tag) is the
# same for every app.
ml-model-serving:
  image:
    repository: gitea.ops-ahead.localtest.me/ops-ahead/ml-model-serving
    tag: latest
    pullPolicy: IfNotPresent

deployment:
  replicaCount: 1
  # Bump to any new value (e.g. a date) to force a rollout — see the
  # annotation this feeds in templates/deployment.yaml. Empty by default:
  # no annotation, no unnecessary diff on every sync.
  restartedAt: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    mlflowTrackingUri: http://mlflow-tracking.ml.svc.cluster.local:5000
    volumeModelName: volume-forecast
    breachModelName: breach-risk
    httpPort: "8080"

hpa:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
