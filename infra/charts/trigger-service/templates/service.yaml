apiVersion: v1
kind: Service
metadata:
  name: {{ include "trigger-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trigger-service.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "trigger-service.fullname" . }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.deployment.env.httpPort }}
