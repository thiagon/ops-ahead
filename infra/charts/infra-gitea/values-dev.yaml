# Local Git server — ArgoCD points to it instead of GitHub.
# Working dir is pushed as branch 'main' by dev-up.sh / dev-sync.sh.
gitea:
  enabled: true
  # RWO PVC: old pod must release the LevelDB lock before the new one starts.
  # RollingUpdate deadlocks on the shared /data volume (CrashLoop on the new pod).
  strategy:
    type: Recreate
  gitea:
    admin:
      existingSecret: gitea-admin-secret
    config:
      database:
        DB_TYPE: sqlite3
      server:
        DOMAIN: gitea.ops-ahead.localtest.me
        HTTP_PORT: 3000
        ROOT_URL: http://gitea.ops-ahead.localtest.me
        DISABLE_SSH: true
        OFFLINE_MODE: true
      service:
        DISABLE_REGISTRATION: true
      security:
        INSTALL_LOCK: true
      packages:
        ENABLED: true
      actions:
        ENABLED: true
  service:
    http:
      type: ClusterIP
      clusterIP: ""
      port: 3000
      # Routes this Service through the ServersTransport in infra/apps/ingresses.yaml,
      # which raises the backend timeouts the registry push needs.
      annotations:
        traefik.ingress.kubernetes.io/service.serverstransport: infra-gitea-registry@kubernetescrd
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  postgresql:
    enabled: false
  postgresql-ha:
    enabled: false
  redis-cluster:
    enabled: false
  redis:
    enabled: false
  memcached:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Gitea Actions runner: act_runner drives builds via a dind sidecar. hostNetwork
# so the registry host `gitea.ops-ahead.localtest.me` (→127.0.0.1 via hostAliases)
# lands on the node's Traefik, the same path `make push` uses from the host.
runner:
  enabled: true
  image: gitea/act_runner:0.2.11
  dindImage: docker:27-dind
  # Job container image (has git + tooling; act's default ubuntu runner).
  jobImage: ghcr.io/catthehacker/ubuntu:act-22.04
  registrationSecret: gitea-runner-token
