apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ops-ahead-agent.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
      - model_name: default
        litellm_params:
          model: anthropic/{{ .Values.litellm.defaultModel }}
          api_key: os.environ/ANTHROPIC_API_KEY
        model_info:
          mode: chat

      - model_name: fallback
        litellm_params:
          model: openai/{{ .Values.litellm.fallbackModel }}
          api_key: os.environ/OPENAI_API_KEY
        model_info:
          mode: chat

    router_settings:
      fallbacks:
        - default: [fallback]
      num_retries: 3
      retry_after: 5

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
