{{- if .Values.networkPolicy.enabled }}
# ns:agent — accepts from ns:ui; egress to ns:ml and ns:data handled by their policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-default
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Acesso a data (MinIO, Kafka, ClickHouse) e ml (MLflow)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml
    # Pods do mesmo namespace
    - to:
        - podSelector: {}
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ui
      ports:
        - port: 4000   # LiteLLM proxy
        - port: 80
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
    # Allow from kube-system (Traefik ingress controller)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
{{- end }}
