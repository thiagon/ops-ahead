{{- if .Values.networkPolicy.enabled }}
# ns:agent — accepts from ns:ui; egress to ns:ml and ns:data handled by their policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-default
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # data: MinIO S3 (9000), Kafka plaintext/TLS (9092/9093), ClickHouse HTTP (8123)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - port: 9000
        - port: 9092
        - port: 9093
        - port: 8123
    # ml: MLflow API (5000), Redis (6379), Postgres (5432)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml
      ports:
        - port: 5000
        - port: 6379
        - port: 5432
    # Pods do mesmo namespace
    - to:
        - podSelector: {}
    # External LLM APIs (Anthropic, OpenAI) — HTTPS only
    - ports:
        - protocol: TCP
          port: 443
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ui
      ports:
        - port: 4000   # LiteLLM proxy
        - port: 80
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
    # Allow from kube-system (Traefik ingress controller)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
{{- end }}
