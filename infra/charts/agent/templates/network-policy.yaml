{{- if .Values.networkPolicy.enabled }}
# ns:agent — accepts from ns:ui; egress to ns:ml and ns:data handled by their policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-default
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ui
      ports:
        - port: 4000   # LiteLLM proxy
        - port: 80
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
{{- end }}
