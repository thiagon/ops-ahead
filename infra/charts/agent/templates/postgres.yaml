apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-postgres-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ops-ahead-agent.labels" . | nindent 4 }}
data:
  00-init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;

    CREATE TABLE IF NOT EXISTS agent_calls (
      id          SERIAL PRIMARY KEY,
      created_at  TIMESTAMPTZ DEFAULT NOW(),
      session_id  TEXT,
      tool_name   TEXT,
      input       JSONB,
      output      JSONB,
      duration_ms INTEGER
    );

    CREATE TABLE IF NOT EXISTS recommendations (
      id             SERIAL PRIMARY KEY,
      created_at     TIMESTAMPTZ DEFAULT NOW(),
      incident_id    TEXT,
      recommendation TEXT,
      confidence     FLOAT,
      embedding      vector(1536)
    );

    CREATE TABLE IF NOT EXISTS actions (
      id                SERIAL PRIMARY KEY,
      created_at        TIMESTAMPTZ DEFAULT NOW(),
      recommendation_id INTEGER REFERENCES recommendations(id),
      action_type       TEXT,
      payload           JSONB,
      status            TEXT DEFAULT 'pending'
    );
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-postgres
    {{- include "ops-ahead-agent.labels" . | nindent 4 }}
spec:
  serviceName: agent-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: agent-postgres
  template:
    metadata:
      labels:
        app: agent-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          # Secret pré-criado pelo dev-up.sh com POSTGRES_USER/PASSWORD/DB
          envFrom:
            - secretRef:
                name: agent-postgres-secret
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            {{- toYaml (index .Values "agent-postgres" "primary" "resources") | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ index .Values "agent-postgres" "auth" "username" | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ index .Values "agent-postgres" "auth" "username" | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: init-scripts
          configMap:
            name: agent-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ index .Values "agent-postgres" "primary" "persistence" "size" }}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-postgres
    {{- include "ops-ahead-agent.labels" . | nindent 4 }}
spec:
  selector:
    app: agent-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: agent-postgres-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-postgres
    {{- include "ops-ahead-agent.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: agent-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
