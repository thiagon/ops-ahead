apiVersion: v1
kind: Secret
metadata:
  name: litellm-api-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ops-ahead-agent.labels" . | nindent 4 }}
  annotations:
    # Preencher antes de usar: kubectl create secret generic litellm-api-keys \
    #   --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
    #   --from-literal=OPENAI_API_KEY=sk-... \
    #   --from-literal=LITELLM_MASTER_KEY=... \
    #   -n agent --dry-run=client -o yaml | kubectl apply -f -
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "PLACEHOLDER"
  OPENAI_API_KEY: "PLACEHOLDER"
  LITELLM_MASTER_KEY: "ops-ahead-dev-key"
