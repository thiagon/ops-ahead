# ─── Postgres + pgvector (bitnami — alias agent-postgres) ────────────────────
agent-postgres:
  enabled: true
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: pg16
  auth:
    username: agent
    password: agent
    database: agent
  primary:
    persistence:
      size: 10Gi
    initdb:
      scripts:
        00-init.sql: |
          CREATE EXTENSION IF NOT EXISTS vector;

          CREATE TABLE IF NOT EXISTS agent_calls (
            id          SERIAL PRIMARY KEY,
            created_at  TIMESTAMPTZ DEFAULT NOW(),
            session_id  TEXT,
            tool_name   TEXT,
            input       JSONB,
            output      JSONB,
            duration_ms INTEGER
          );

          CREATE TABLE IF NOT EXISTS recommendations (
            id            SERIAL PRIMARY KEY,
            created_at    TIMESTAMPTZ DEFAULT NOW(),
            incident_id   TEXT,
            recommendation TEXT,
            confidence    FLOAT,
            embedding     vector(1536)
          );

          CREATE TABLE IF NOT EXISTS actions (
            id                 SERIAL PRIMARY KEY,
            created_at         TIMESTAMPTZ DEFAULT NOW(),
            recommendation_id  INTEGER REFERENCES recommendations(id),
            action_type        TEXT,
            payload            JSONB,
            status             TEXT DEFAULT 'pending'
          );

# ─── LiteLLM proxy ───────────────────────────────────────────────────────────
litellm:
  replicas: 1
  image: ghcr.io/berriai/litellm:main-stable
  defaultModel: claude-sonnet-4-6
  fallbackModel: gpt-4.1
  masterKey: "PLACEHOLDER"  # sobrescrever via Secret ou values-dev.yaml

networkPolicy:
  enabled: false
