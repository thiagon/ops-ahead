apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ops-ahead-data.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until wget -q --spider http://minio:9000/minio/health/ready; do
                echo "Waiting for MinIO..."; sleep 5
              done
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-03-13T23-51-57Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootPassword
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb local/{{ .Values.minio.bucket }} --ignore-existing
              mc anonymous set download local/{{ .Values.minio.bucket }}
              echo "Bucket {{ .Values.minio.bucket }} ready"
