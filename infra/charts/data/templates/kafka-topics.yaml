{{- if .Values.kafka.enabled }}
{{- range .Values.kafkaTopics }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .name | replace "." "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    strimzi.io/cluster: ops-ahead
    {{- include "ops-ahead-data.labels" $ | nindent 4 }}
spec:
  partitions: {{ .partitions }}
  replicas: {{ .replicas }}
  topicName: {{ .name }}
{{- end }}
{{- end }}
