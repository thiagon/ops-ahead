{{- if .Values.kafka.enabled }}
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: ops-ahead
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ops-ahead-data.labels" . | nindent 4 }}
spec:
  kafka:
    version: 3.7.0
    replicas: {{ .Values.kafka.cluster.replicas }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      log.retention.ms: {{ .Values.kafka.cluster.retention.ms | quote }}
      log.message.format.version: "3.7"
      inter.broker.protocol.version: "3.7"
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: {{ .Values.kafka.cluster.storage.size }}
          deleteClaim: false
  zookeeper:
    replicas: {{ .Values.kafka.zookeeper.replicas }}
    storage:
      type: persistent-claim
      size: {{ .Values.kafka.zookeeper.storage.size }}
      deleteClaim: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
{{- end }}
