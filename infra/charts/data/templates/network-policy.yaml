{{- if .Values.networkPolicy.enabled }}
# ns:data — accepts ingress from ns:ml and ns:agent only
# ns:ui is explicitly blocked from reaching data services directly
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-default
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Egress inter-namespace permitido
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
    # Pods do mesmo namespace
    - to:
        - podSelector: {}
  ingress:
    # Allow from same namespace
    - from:
        - podSelector: {}
    # Allow from ns:ml and ns:agent
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent
    # Allow from ns:infra (Prometheus scraping)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
    # Allow from kube-system (Traefik ingress controller)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
{{- end }}
