apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ops-ahead-data.labels" . | nindent 4 }}
type: Opaque
stringData:
  rootUser: {{ .Values.minio.credentials.rootUser | quote }}
  rootPassword: {{ .Values.minio.credentials.rootPassword | quote }}
