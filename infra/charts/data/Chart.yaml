apiVersion: v2
name: ops-ahead-data
description: Ops Ahead data namespace — Kafka (Strimzi), MinIO, ClickHouse (Altinity), Argo Workflows
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: strimzi-kafka-operator
    version: "0.43.0"
    repository: "https://strimzi.io/charts/"
    condition: kafka.enabled
  - name: altinity-clickhouse-operator
    version: "0.23.7"
    repository: "https://docs.altinity.com/clickhouse-operator/"
    condition: clickhouse.operatorEnabled
  - name: argo-workflows
    version: "0.41.9"
    repository: "https://argoproj.github.io/argo-helm"
    condition: argoWorkflows.enabled
