apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    # Created before the server and worker (wave 0) so both can mount it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: authentik-secret
    creationPolicy: Owner
  data:
    # Signs sessions and derives unique user ids — rotating it invalidates
    # every existing session, so it is written once and left alone.
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef: { key: authentik, property: AUTHENTIK_SECRET_KEY }
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef: { key: authentik, property: UI_POSTGRES_PASSWORD }
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef: { key: authentik, property: AUTHENTIK_BOOTSTRAP_PASSWORD }
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef: { key: authentik, property: AUTHENTIK_BOOTSTRAP_EMAIL }
    # Handed to the gateway as AUTHENTIK_CLIENT_SECRET; the MCP client is
    # public and has none.
    # Read by the blueprint as !Env, which strips the AUTHENTIK_ prefix.
    - secretKey: AUTHENTIK_GATEWAY_WEB_CLIENT_SECRET
      remoteRef: { key: authentik, property: AUTHENTIK_CLIENT_SECRET }
