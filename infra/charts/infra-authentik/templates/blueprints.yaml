apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infra-authentik.labels" . | nindent 4 }}
data:
  # The gateway is one resource with two ways in: a browser that goes through
  # the BFF, and an MCP client that holds its own token. Two OAuth providers
  # rather than one because only the first can keep a secret.
  gateway.yaml: |
    version: 1
    metadata:
      name: ops-ahead gateway
    entries:
      # Discovery order across blueprints is not guaranteed, and a `!Find` that
      # misses resolves to null without failing the apply — the provider would
      # come up with no authorization flow and no scopes, reported as success.
      # Applying each referenced blueprint first is what makes the `!Find`s
      # below deterministic.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider authorization flow (implicit consent)
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider authorization flow (explicit consent)
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider invalidation flow
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: System - OAuth2 Provider - Scopes
      # Owns the akadmin user the locaweb group below takes as its member.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: authentik Bootstrap

      # What makes a group a tenant: the claim carries the group names
      # verbatim, and the gateway compares the :tenant of the URL against them.
      # Defined before the providers that !KeyOf it — an entry resolves only
      # against what earlier entries in the same blueprint already created.
      - id: tenant-groups-mapping
        model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: "ops-ahead groups"
        attrs:
          scope_name: groups
          description: "The tenants this person operates"
          expression: |
            return [
              group.name
              for group in request.user.ak_groups.all()
              if not group.name.startswith("authentik ")
            ]

      - id: gateway-web-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: gateway-web
        attrs:
          client_type: confidential
          client_id: gateway-web
          client_secret: !Env AUTHENTIK_GATEWAY_WEB_CLIENT_SECRET
          # Required since 2026.5. The BFF spends a refresh token to keep a
          # session alive without sending the person back through the login.
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            {{- range .Values.gateway.redirectUris }}
            - matching_mode: strict
              url: {{ . | quote }}
            {{- end }}
          # The gateway asks the provider whether a token is still live on
          # every request, so it reads what this scope carries.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf tenant-groups-mapping
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        identifiers:
          slug: gateway-web
        attrs:
          name: ops-ahead gateway
          provider: !KeyOf gateway-web-provider

      - id: gateway-mcp-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: gateway-mcp
        attrs:
          client_type: public
          client_id: gateway-mcp
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: regex
              url: ".*"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf tenant-groups-mapping
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        identifiers:
          slug: gateway-mcp
        attrs:
          name: ops-ahead gateway (MCP)
          provider: !KeyOf gateway-mcp-provider

      # Dev tenant: the group *is* the tenant, same name, no prefix. The
      # bootstrap admin is put in it so the first login already operates
      # locaweb — membership lives here, never in a script.
      - id: locaweb-group
        model: authentik_core.group
        identifiers:
          name: locaweb
        attrs:
          name: locaweb
          users:
            - !Find [authentik_core.user, [username, akadmin]]
