apiVersion: batch/v1
kind: Job
metadata:
  name: orchestrator-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ui-orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  # A PreSync hook stuck on ImagePullBackOff blocks the sync operation, and at
  # bootstrap the first attempt runs against a stale tag whose image is absent.
  # Failing quickly releases the operation so auto-sync can roll forward to the
  # CI write-back.
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: orchestrator-migrate
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: migrations
          emptyDir: {}
      initContainers:
        - name: copy-migrations
          image: {{ include "ui-orchestrator.image" . | quote }}
          imagePullPolicy: {{ (index .Values "ui-orchestrator").image.pullPolicy }}
          command: ["cp", "-r", "/app/migrations/.", "/migrations/"]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      containers:
        - name: migrate
          image: {{ .Values.migration.image }}
          imagePullPolicy: {{ .Values.migration.pullPolicy }}
          args:
            - "-path=/migrations"
            - "-database=$(DATABASE_URL)"
            - "up"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.secretName }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.secretName }}
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ .Values.orchestrator.env.configPostgresHost }}/$(POSTGRES_DB)?sslmode=disable
          volumeMounts:
            - name: migrations
              mountPath: /migrations
