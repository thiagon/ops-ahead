apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui-orchestrator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ui-orchestrator.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: {{ .Release.Namespace }}
  labels:
    app: orchestrator
    {{- include "ui-orchestrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        {{- include "ui-orchestrator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: ui-orchestrator
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # 'node' in node:24-trixie-slim.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: {{ include "ui-orchestrator.image" . | quote }}
          imagePullPolicy: {{ (index .Values "ui-orchestrator").image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.orchestrator.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ENV
              value: {{ .Values.orchestrator.env.appEnv | quote }}
            - name: PORT
              value: {{ .Values.orchestrator.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.orchestrator.env.logLevel | quote }}
            - name: SERVICE_NAME
              value: {{ .Values.orchestrator.env.serviceName | quote }}
            - name: SERVICE_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.orchestrator.env.kafkaBootstrapServers | quote }}
            - name: KAFKA_TOPIC_ML
              value: {{ .Values.orchestrator.env.kafkaTopicMl | quote }}
            - name: KAFKA_TOPIC_DATA
              value: {{ .Values.orchestrator.env.kafkaTopicData | quote }}
            - name: KAFKA_TOPIC_STATUS
              value: {{ .Values.orchestrator.env.kafkaTopicStatus | quote }}
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          # trigger.status must be fully rehydrated before the app starts
          # listening (see src/plugins/kafka.ts) — generous headroom for a
          # cold cluster bootstrap where data-kafka's pod may still be
          # settling even though its Application already synced.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
