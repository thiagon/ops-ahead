# Same PreSync-hook pattern data-ingest's migration Job already uses, applied
# PostSync here: catches a misconfigured host/port (typo'd values.yaml, a
# broker not actually up yet) as a failed ArgoCD sync instead of a pod that
# silently never becomes ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: ui-orchestrator-healthcheck
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ui-orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: ui-orchestrator-healthcheck
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check-kafka
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              HOST="${KAFKA_BOOTSTRAP_SERVERS%%:*}"
              PORT="${KAFKA_BOOTSTRAP_SERVERS##*:}"
              echo "checking Kafka at ${HOST}:${PORT}..."
              nc -z -w5 "$HOST" "$PORT"
              echo "Kafka reachable"
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.orchestrator.env.kafkaBootstrapServers | quote }}
