apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.consumer.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # PreSync, not just an early wave: the whole PreSync phase (this resource)
    # runs before any Sync-phase resource (the Deployment, wave 0, or the
    # migrate Job below) — a wave alone wouldn't order it ahead of a hook.
    # hook-weight "-1" beats the migrate Job's default "0" within the phase.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.consumer.secretName }}
    creationPolicy: Owner
  # One Vault path for every secret this app needs — same pattern as
  # ml-mlflow's `mlflow` key (8 properties, one path). Never split an app's
  # own secrets across multiple Vault paths by resource.
  data:
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef: { key: data-ingest, property: CLICKHOUSE_PASSWORD }
    - secretKey: CLICKHOUSE_MIGRATE_URL
      remoteRef: { key: data-ingest, property: CLICKHOUSE_MIGRATE_URL }
    - secretKey: minio-access-key
      remoteRef: { key: data-ingest, property: MINIO_ROOT_USER }
    - secretKey: minio-secret-key
      remoteRef: { key: data-ingest, property: MINIO_ROOT_PASSWORD }
