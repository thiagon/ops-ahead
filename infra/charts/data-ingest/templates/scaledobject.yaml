# KEDA scales this Deployment's replica count from the raw topics' consumer
# lag, down to zero when idle. One consumer group reads both raw topics
# (ingestion + translation, same process — see src/main.py), so a lag spike on
# either topic — alert or monitor — must be able to scale the deployment up.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: data-ingest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-ingest.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "data-ingest.fullname" . }}
  pollingInterval: {{ .Values.scaledObject.pollingInterval }}
  cooldownPeriod: {{ .Values.scaledObject.cooldownPeriod }}
  minReplicaCount: {{ .Values.scaledObject.minReplicaCount }}
  maxReplicaCount: {{ .Values.scaledObject.maxReplicaCount }}
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.consumer.env.kafkaBootstrapServers | quote }}
        consumerGroup: {{ .Values.consumer.env.kafkaGroupId | quote }}
        topic: {{ .Values.consumer.env.kafkaTopicRawAlert | quote }}
        lagThreshold: {{ .Values.scaledObject.lagThreshold | quote }}
        offsetResetPolicy: earliest
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.consumer.env.kafkaBootstrapServers | quote }}
        consumerGroup: {{ .Values.consumer.env.kafkaGroupId | quote }}
        topic: {{ .Values.consumer.env.kafkaTopicRawMonitor | quote }}
        lagThreshold: {{ .Values.scaledObject.lagThreshold | quote }}
        offsetResetPolicy: earliest
