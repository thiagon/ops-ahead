apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-ingest.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-ingest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "data-ingest.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "data-ingest.fullname" . }}
        {{- include "data-ingest.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # The 'clickhouse' Service makes Kubernetes inject a legacy CLICKHOUSE_PORT
      # env (tcp://ip:port) that collides with the app's int CLICKHOUSE_PORT.
      enableServiceLinks: false
      containers:
        - name: consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.consumer.env.kafkaBootstrapServers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.consumer.env.kafkaTopic | quote }}
            - name: KAFKA_GROUP_ID
              value: {{ .Values.consumer.env.kafkaGroupId | quote }}
            - name: CLICKHOUSE_HOST
              value: {{ .Values.consumer.env.clickhouseHost | quote }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.consumer.env.clickhouseDatabase | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.consumer.env.minioEndpoint | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.consumer.env.minioBucket | quote }}
            - name: BATCH_MAX_SIZE
              value: {{ .Values.consumer.env.batchMaxSize | quote }}
            - name: BATCH_MAX_SECONDS
              value: {{ .Values.consumer.env.batchMaxSeconds | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.consumer.env.clickhouseUser | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.consumer.secretName }}
                  key: CLICKHOUSE_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.consumer.secretName }}
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.consumer.secretName }}
                  key: minio-secret-key
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
