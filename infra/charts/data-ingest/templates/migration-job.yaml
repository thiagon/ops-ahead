apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "data-ingest.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-ingest.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  # Fail (instead of hanging) if the image can't be pulled or migrations stall —
  # otherwise a PreSync hook stuck on ImagePullBackOff wedges the whole sync.
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: {{ include "data-ingest.fullname" . }}-migrate
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: migrations
          emptyDir: {}
      initContainers:
        - name: copy-migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["cp", "-r", "/app/migrations/.", "/migrations/"]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      containers:
        - name: migrate
          image: {{ .Values.migration.image }}
          imagePullPolicy: {{ .Values.migration.pullPolicy }}
          args:
            - "-path=/migrations"
            - "-database=$(DATABASE_URL)"
            - "up"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.secretName }}
                  key: CLICKHOUSE_MIGRATE_URL
          volumeMounts:
            - name: migrations
              mountPath: /migrations
