image:
  repository: gitea.ops-ahead.local/ops-ahead/data-ingest
  tag: latest
  pullPolicy: IfNotPresent

migration:
  image: migrate/migrate:v4.18.1
  pullPolicy: IfNotPresent
  secretName: clickhouse-secret

consumer:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    kafkaBootstrapServers: kafka-bootstrap.data.svc.cluster.local:9092
    kafkaTopic: incidents.raw
    kafkaGroupId: raw-ingest
    clickhouseHost: clickhouse.data.svc.cluster.local
    clickhouseDatabase: default
    minioEndpoint: http://minio.infra.svc.cluster.local:9000
    minioBucket: ops-ahead-lake
    batchMaxSize: "1000"
    batchMaxSeconds: "5"
  secretName: data-ingest-secret
