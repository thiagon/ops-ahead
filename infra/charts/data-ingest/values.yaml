# Keyed by the app's own name so the write-back rule (<app>.image.tag) is the
# same for every app.
data-ingest:
  image:
    repository: gitea.ops-ahead.localtest.me/ops-ahead/data-ingest
    tag: latest
    pullPolicy: IfNotPresent

migration:
  image: migrate/migrate:v4.18.1
  pullPolicy: IfNotPresent
  # data-ingest's own secret, not data-clickhouse's — an app's migration job
  # should never depend on another chart's Secret object staying named and
  # shaped the way it happens to be today.
  secretName: data-ingest-secret

consumer:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    kafkaBootstrapServers: ops-ahead-kafka-bootstrap.data.svc.cluster.local:9092
    kafkaTopicRawAlert: events.raw.alert
    kafkaTopicRawMonitor: events.raw.monitor
    kafkaTopicAlert: events.alert
    kafkaTopicMonitor: events.monitor
    kafkaTopicMilestone: deadlines.milestone
    kafkaTopicRulesMapping: rules.mapping
    kafkaTopicRulesDeadline: rules.deadline
    kafkaTopicRulesTarget: rules.target
    kafkaGroupId: events-ingest
    clickhouseHost: clickhouse.data.svc.cluster.local
    clickhouseUser: ops_ahead
    clickhouseDatabase: default
    minioEndpoint: http://minio.data.svc.cluster.local:9000
    minioBucket: ops-ahead-lake
    # Fetch size of the raw and milestone subscribers. The handler writes the
    # whole fetch and commits the offset after that write; batchMaxSeconds
    # only bounds how long an incomplete fetch waits.
    batchMaxSize: "1000"
    batchMaxSeconds: "5"
  secretName: data-ingest-secret

scaledObject:
  pollingInterval: 15
  cooldownPeriod: 300
  # Any lag must wake a replica: minReplicaCount is 0, so a threshold above 1
  # leaves leftover messages unconsumed forever. Batching is batchMaxSize /
  # batchMaxSeconds inside the consumer, not "don't scale yet".
  lagThreshold: "1"
  minReplicaCount: 0
  maxReplicaCount: 5
