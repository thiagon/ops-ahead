# Namespaces com Pod Security Standards, ResourceQuotas e LimitRanges.
# PSS enforce=baseline bloqueia privileged/hostPID/hostPath; warn=restricted
# alerta no kubectl apply quando algo poderia ser mais restrito.
---
apiVersion: v1
kind: Namespace
metadata:
  name: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    ops-ahead/monitor: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    ops-ahead/monitor: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: ml
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    ops-ahead/monitor: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: ui
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    ops-ahead/monitor: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
# ─── ResourceQuotas ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: infra
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    # Steady-state usage sits around 15.3 CPU across the infra stack (ArgoCD,
    # Prometheus, Loki, Vault, KEDA, Gitea...) — a rolling update needs old+new
    # pod simultaneously, so the ceiling needs headroom above steady-state for
    # at least one surge pod. Node has 20 CPU capacity, so this isn't scarce.
    limits.cpu: "20"
    limits.memory: 32Gi
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: infra
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 4Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: data
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "16"
    limits.memory: 24Gi
    pods: "30"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: ml
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: ui
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 1536Mi
    # ui-gateway/ui-frontend's steady-state limits didn't fit
    # in the previous 2 CPU — a rolling update needing old+new pods
    # simultaneously got stuck in FailedCreate against the old ceiling.
    limits.cpu: "3"
    limits.memory: 3Gi
    pods: "10"
---
# ─── LimitRanges — defaults para containers sem requests/limits explícitos ───
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: ml
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: ui
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: data
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 4Gi
# ─── NetworkPolicies ─────────────────────────────────────────────────────────
# Estratégia: default-deny ingress por namespace; egress livre.
# Tráfego permitido em todos os namespaces:
#   - mesmo namespace (pods se comunicam internamente)
#   - kube-system (Traefik roteia URLs externas para os pods)
#   - infra (ESO puxa segredos, Prometheus coleta métricas, ArgoCD health checks)
# Fluxos cross-namespace adicionais conforme topologia da aplicação.
#
# Egress não é restrito — restrições de egress exigem mapeamento completo de
# destinos externos (DBs, APIs, DNS) e não agregam valor em dev local.
---
# ── infra ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # ui: the gateway introspects tokens and exchanges codes at Authentik.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ui
      ports:
        - port: 80
        - port: 9000
---
# ── data ───────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml
    # ui: o gateway publica nos tópicos events.raw.* — só o listener do Kafka.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ui
      ports:
        - port: 9092
    # ui: ui-frontend lê a camada gold/silver pela interface HTTP do ClickHouse.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ui
      ports:
        - port: 8123
---
# ── ml ─────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ml
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: ml
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ui
    # data-runner closes the daily chain here: the snapshot it fingerprints is
    # logged to MLflow (5000) and the cache-aside copy the inference path reads
    # is published to Redis (6379).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - port: 5000
        - port: 6379
---
# ── ui ─────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ui
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: ui
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
    # ml-trainer / data-runner PATCH /analyses/{id} with the run_key from
    # the trigger.* message they consumed.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml
      ports:
        - port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - port: 3000
