apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-ingest
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  revisionHistoryLimit: 3
  project: ops-ahead
  # Multi-source: base chart from infra/charts; per-env overlay + CI-written
  # image version come from the app's colocated apps/data-ingest/chart/.
  sources:
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      ref: values
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      path: infra/charts/data-ingest
      helm:
        valueFiles:
          - values.yaml
          - $values/apps/data-ingest/chart/values-dev.yaml
          - $values/apps/data-ingest/chart/values-image.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
