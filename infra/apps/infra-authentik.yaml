apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-authentik
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  revisionHistoryLimit: 3
  project: ops-ahead
  source:
    repoURL: https://github.com/thiagon/ops-ahead
    targetRevision: main
    path: infra/charts/infra-authentik
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
