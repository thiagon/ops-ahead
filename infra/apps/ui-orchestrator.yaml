apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ui-orchestrator
  namespace: infra
  annotations:
    # After data-kafka (6, the broker it talks to) and infra-keda (2, whose
    # ScaledObjects scale the consumers of what it publishes) — same wave
    # trigger-service used.
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  revisionHistoryLimit: 3
  project: ops-ahead
  # Multi-source: base chart from infra/charts; the app's colocated per-env
  # overlay (apps/ui-orchestrator/chart/values-dev.yaml) carries the
  # CI-pinned image tag. Replaces trigger-service.yaml — see
  # conductor/tracks/exec-trigger_20260807/spec.md.
  sources:
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      ref: values
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      path: infra/charts/ui-orchestrator
      helm:
        valueFiles:
          - values.yaml
          - $values/apps/ui-orchestrator/chart/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
