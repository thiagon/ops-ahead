apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-deadline-tracker
  namespace: infra
  annotations:
    # After data-kafka (6, the topic it consumes/publishes) and data-runner
    # (8, whose PreSync hook seeds tenant_deadlines — the table itself, not
    # just the ClickHouse server, is what this app's startup reads).
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  revisionHistoryLimit: 3
  project: ops-ahead
  sources:
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      ref: values
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      path: infra/charts/data-deadline-tracker
      helm:
        valueFiles:
          - values.yaml
          - $values/apps/data-deadline-tracker/chart/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
