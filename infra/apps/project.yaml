apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ops-ahead
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Ops Ahead — AIOps platform (FIAP Enterprise Challenge 2026)
  sourceRepos:
    - https://github.com/thiagon/ops-ahead
    - http://ops-ahead-infra-gitea-http.infra.svc.cluster.local:3000/ops-ahead/ops-ahead
    - https://argoproj.github.io/argo-helm
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://helm.releases.hashicorp.com
    - https://strimzi.io/charts/
    - https://docs.altinity.com/clickhouse-operator/
    - https://charts.bitnami.com/bitnami
  destinations:
    - server: https://kubernetes.default.svc
      namespace: infra
    - server: https://kubernetes.default.svc
      namespace: data
    - server: https://kubernetes.default.svc
      namespace: ml
    - server: https://kubernetes.default.svc
      namespace: llm
    - server: https://kubernetes.default.svc
      namespace: ui
    # Operadores (argo-workflows, clickhouse, strimzi) deployam roles/CRDs
    # em 'default' como parte de instalação cluster-wide.
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
    # Strimzi (Kafka operator)
    - group: kafka.strimzi.io
      kind: '*'
    # ClickHouse operator
    - group: clickhouse.altinity.com
      kind: '*'
    # Prometheus operator
    - group: monitoring.coreos.com
      kind: '*'
    # Vault
    - group: vault.hashicorp.com
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true
