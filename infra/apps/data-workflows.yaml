apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-workflows
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  revisionHistoryLimit: 3
  project: ops-ahead
  # Engine only. The pipeline definitions live in pipelines/* and are deployed by
  # the pipelines ApplicationSet (infra/apps/pipelines-appset.yaml), wave 6.
  source:
    repoURL: https://github.com/thiagon/ops-ahead
    targetRevision: main
    path: infra/charts/data-workflows
    helm:
      releaseName: argo-workflows
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
