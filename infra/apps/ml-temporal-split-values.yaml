# Single source of truth for the temporal split boundaries shared by every
# trained model in this track (ml-volume-model, ml-breach-model — see
# src/split.py in each). Both charts' own values.yaml intentionally omit
# job.env.trainEnd/validationEnd/holdoutEnd so there is exactly one place to
# change them; edit here, both training Jobs pick it up on their next sync.
#
# Boundaries are validated against the real dataset (assets/incidents.csv,
# 2023-01-02 .. 2025-12-31): train ≈50k rows, validation ≈23k rows, holdout
# ≈50k rows — none empty. If the dataset's range ever changes, each training
# job fails fast (empty-partition check in src/split.py) instead of silently
# training on a degenerate split.
job:
  env:
    trainEnd: "2025-09-30"
    validationEnd: "2025-10-31"
    holdoutEnd: "2026-01-31"
