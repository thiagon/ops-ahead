apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pipelines
  namespace: infra
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # One Application per pipelines/*/appset.yaml. Add a pipeline = add a folder.
    - git:
        repoURL: https://github.com/thiagon/ops-ahead
        revision: main
        files:
          - path: pipelines/*/appset.yaml
  template:
    metadata:
      name: 'pipeline-{{ .name }}'
      namespace: infra
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: ops-ahead
      revisionHistoryLimit: 3
      # Base chart lives in infra (.chart); the pipeline folder is config only.
      # templatePatch below replaces this with the extra $values overlays.
      sources:
        - repoURL: https://github.com/thiagon/ops-ahead
          targetRevision: main
          ref: values
        - repoURL: https://github.com/thiagon/ops-ahead
          targetRevision: main
          path: '{{ .chart }}'
          helm:
            valueFiles:
              - values.yaml
              - '$values/pipelines/{{ .name }}/values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
  # Ranging into a list field only works in a raw templatePatch (a string block),
  # so the manifest itself stays valid YAML. Merge-patch replaces spec.sources
  # wholesale, so both sources are restated here with the extra $values overlays.
  templatePatch: |
    spec:
      sources:
        - repoURL: https://github.com/thiagon/ops-ahead
          targetRevision: main
          ref: values
        - repoURL: https://github.com/thiagon/ops-ahead
          targetRevision: main
          path: {{ .chart }}
          helm:
            valueFiles:
              - values.yaml
              - $values/pipelines/{{ .name }}/values.yaml
              {{- range .extraValueFiles }}
              - $values/{{ . }}
              {{- end }}
  syncPolicy:
    # A misfiring generator must never delete a running pipeline's resources.
    preserveResourcesOnDeletion: true
