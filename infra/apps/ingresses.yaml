# Traefik Ingress resources — dev overlay
# All services accessible via *.ops-ahead.localtest.me (add to /etc/hosts → 127.0.0.1)
# Single entry point: port 80 on the k3d loadbalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: vault.ops-ahead.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-vault
                port:
                  number: 8200
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.ops-ahead.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-argocd-server
                port:
                  number: 80
