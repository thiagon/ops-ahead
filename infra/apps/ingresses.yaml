# Traefik Ingress resources — dev overlay
# All services accessible via *.ops-ahead.localtest.me (add to /etc/hosts → 127.0.0.1)
# Single entry point: port 80 on the k3d loadbalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: vault.ops-ahead.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-vault
                port:
                  number: 8200
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.ops-ahead.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-argocd-server
                port:
                  number: 80
---
# Gitea local — só dev. Permite ArgoCD apontar pra Git local em vez do GitHub.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: gitea.ops-ahead.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-gitea-http
                port:
                  number: 3000
---
# Camadas do ml-trainer (prophet, shap, optuna, scikit-learn) levam minutos para
# subir e o Gitea só responde o header quando terminou de recebê-las. Sem isso o
# Traefik desiste no meio do `docker push` e o registry devolve 504.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: gitea-registry
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 1h
    idleConnTimeout: 10m

---
# Router HTTPS separado só pro `docker push`: registries em insecure-registries
# fazem o docker preferir HTTPS, e sem router no 443 o Traefik responde 404. Fica
# num Ingress próprio porque `router.tls` vale pro router inteiro — se fosse no
# mesmo do `web`, forçaria TLS no 80 e quebraria o HTTP (browser + git push).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-tls
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gitea.ops-ahead.localtest.me
  rules:
    - host: gitea.ops-ahead.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-gitea-http
                port:
                  number: 3000
