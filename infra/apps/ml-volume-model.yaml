apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-volume-model
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  revisionHistoryLimit: 3
  project: ops-ahead
  # Multi-source: base chart from infra/charts; the app's colocated per-env
  # overlay (apps/ml-volume-model/chart/values-dev.yaml) carries the CI-pinned
  # image tag.
  sources:
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      ref: values
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      path: infra/charts/ml-volume-model
      helm:
        valueFiles:
          - values.yaml
          - $values/apps/ml-volume-model/chart/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ml
  # Manual/on-demand sync — training is triggered deliberately, not on every
  # commit. No `automated:` block: `argocd app sync ml-volume-model` (or the
  # UI) is what actually runs a training Job.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
