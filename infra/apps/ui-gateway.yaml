apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ui-gateway
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  revisionHistoryLimit: 3
  project: ops-ahead
  # Multi-source: base chart from infra/charts; app overlays in apps/ui-gateway/chart/
  # — values-prod.yaml (ops-ahead.xyz), values-dev.yaml (CI image tag). On k3d,
  # reconcile appends values-local.yaml (localtest.me).
  sources:
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      ref: values
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      path: infra/charts/ui-gateway
      helm:
        valueFiles:
          - values.yaml
          - $values/apps/ui-gateway/chart/values-prod.yaml
          - $values/apps/ui-gateway/chart/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    # Kept low on purpose — same reason as data-ingest: at bootstrap the
    # snapshot still carries the previous run's image tag, and retrying that
    # revision pins the sync operation to it instead of rolling forward to the
    # CI write-back that does have an image in the registry.
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 40s
