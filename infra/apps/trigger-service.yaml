apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trigger-service
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  revisionHistoryLimit: 3
  project: ops-ahead
  # Multi-source: base chart from infra/charts; the app's colocated per-env
  # overlay (apps/trigger-service/chart/values-dev.yaml) carries the
  # CI-pinned image tag. Sync wave 8 — after data-workflows (5, Argo CRDs/
  # controller) and data-kafka (6, the broker this app's lifespan connects
  # to on startup) and alongside/after data-ingest (7).
  sources:
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      ref: values
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      path: infra/charts/trigger-service
      helm:
        valueFiles:
          - values.yaml
          - $values/apps/trigger-service/chart/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
