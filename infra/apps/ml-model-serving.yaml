apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-model-serving
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  revisionHistoryLimit: 3
  project: ops-ahead
  # Multi-source: base chart from infra/charts; the app's colocated per-env
  # overlay (apps/ml-model-serving/chart/values-dev.yaml) carries the
  # CI-pinned image tag. Sync wave 10 — after ml-trainer (wave 9), so the
  # Deployment a training run needs exists first. Registering it doesn't
  # itself run a training (a trigger.ml event does that on demand, via
  # ui-orchestrator + ml-trainer) — /readyz tolerates neither model being
  # loaded yet either way.
  sources:
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      ref: values
    - repoURL: https://github.com/thiagon/ops-ahead
      targetRevision: main
      path: infra/charts/ml-model-serving
      helm:
        valueFiles:
          - values.yaml
          - $values/apps/ml-model-serving/chart/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
